<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CCTV ProMate Web</title>
<link rel="icon" href="../../favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#f4f6fa;--fg:#0f1b2d;--mut:#55627a;--card:#fff;--line:#dbe2ee;--navy:#0b2a4a;--red:#d62828;--teal:#0e8f86;--chip:#e8eef7;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0a121e;--fg:#e8eef8;--mut:#9aa9c0;--card:#111c2c;--line:#22324a;--navy:#8fb4e8;--teal:#3cc5b8;--chip:#17263b;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,"Noto Sans Devanagari",system-ui,sans-serif}
h1,h2,h3{font-family:"Space Grotesk","Noto Sans Devanagari",sans-serif;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left,0px))}
header{background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){header{background:#0d2038}}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
header b{font-family:"Space Grotesk";font-size:19px}
.sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
nav button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--chip);color:var(--fg);cursor:pointer;font-weight:600;min-height:42px}
nav button[aria-current="true"]{background:var(--red);color:#fff}
.btn.p{background:var(--red);color:#fff}.btn.g{background:var(--teal);color:#fff}.btn.d{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.s{padding:6px 10px;min-height:34px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
td input{padding:6px}
.num{text-align:right}
.tot{font-family:"Space Grotesk";font-size:22px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.err{color:var(--bad);font-weight:600}
.hide{display:none!important}
#login{text-align:center;padding:60px 0}
#print{display:none}
@media print{body{background:#fff;color:#000}header,nav,#app,#login,.noprint{display:none!important}#print{display:block;padding:0}}
#print h1{font-size:24px}#print table{min-width:0;font-size:12px}#print th{background:#eee;color:#000}#print td,#print th{border:1px solid #bbb;color:#000}
</style>
</head>
<body>
<header><div class="wrap"><b>CCTV ProMate Web</b><span class="sp"></span><span id="who" class="mut" style="color:#b7c6dc"></span><button class="btn s" id="lang">English</button><button class="btn s hide" id="out">Logout</button></div></header>

<main class="wrap">
<div id="login" class="hide">
  <h2 data-t="loginTitle"></h2>
  <p class="mut" data-t="loginSub"></p>
  <button class="btn p" id="gbtn" data-t="loginBtn" style="font-size:17px;padding:14px 22px"></button>
  <p class="mut" data-t="sameAcc" style="max-width:46ch;margin:18px auto"></p>
  <p class="err" id="lerr"></p>
</div>

<div id="app" class="hide">
  <nav id="nav"></nav>

  <section id="v-list"></section>

  <section id="v-new" class="hide">
    <div class="card">
      <div class="grid">
        <div><label data-t="client"></label><select id="q-client"></select></div>
        <div><label data-t="system"></label><select id="q-sys"><option value="ANALOG">Analog (DVR)</option><option value="IP">IP (NVR)</option><option value="HYBRID">Hybrid (HVR)</option></select></div>
        <div><label data-t="indoor"></label><input id="q-in" type="number" min="0" value="4" inputmode="numeric"></div>
        <div><label data-t="outdoor"></label><input id="q-out" type="number" min="0" value="4" inputmode="numeric"></div>
        <div id="q-ipw" class="hide"><label data-t="ipCams"></label><input id="q-ip" type="number" min="0" value="0" inputmode="numeric"></div>
        <div><label data-t="cablePer"></label><input id="q-cab" type="number" min="1" value="22.5" step="0.5" inputmode="decimal"></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn g" id="q-build" data-t="build"></button><span class="mut" id="q-info"></span></div>
    </div>
    <div id="q-edit" class="hide">
      <div class="card tw"><table><thead><tr><th>#</th><th data-t="item"></th><th data-t="qty"></th><th data-t="unit"></th><th data-t="rate"></th><th class="num" data-t="amt"></th><th></th></tr></thead><tbody id="q-rows"></tbody></table>
        <div class="row" style="margin-top:8px"><button class="btn s" id="q-add" data-t="addRow"></button></div></div>
      <div class="card"><div class="grid">
        <div><label data-t="labour"></label><input id="c-lab" type="number" min="0" value="0" inputmode="decimal"></div>
        <div><label data-t="transport"></label><input id="c-tr" type="number" min="0" value="0" inputmode="decimal"></div>
        <div><label data-t="discount"></label><input id="c-dis" type="number" min="0" value="0" inputmode="decimal"></div>
        <div><label data-t="gst"></label><select id="c-gst"><option value="0">No GST</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option></select></div>
        <div><label data-t="advance"></label><input id="c-adv" type="number" min="0" value="0" inputmode="decimal"></div>
        <div style="grid-column:1/-1"><label data-t="notes"></label><textarea id="c-note" rows="2"></textarea></div>
      </div>
      <div style="margin-top:12px" id="q-sum"></div>
      <div class="row" style="margin-top:12px"><button class="btn p" id="q-save" data-t="save"></button><button class="btn" id="q-cancel" data-t="cancel"></button><span id="q-err" class="err"></span></div></div>
    </div>
  </section>

  <section id="v-cli" class="hide"></section>
  <section id="v-prof" class="hide"></section>
</div>
</main>

<div id="print"></div>

 if(p.sys==="IP")cams("IP ",n,dome);

 var txt=(profile.firm||"CCTV")+" - "+t("quote")+"\n"+(q.client_name||c.name||"")+"\n\n"+(d.items||[]).filter(function(i){return +i.qty>0}).map(function(i){return "• "+i.name+" x "+i.qty+" "+i.unit}).join("\n")+"\n\n"+t("grand")+": "+money(tt.total)+(d.adv?"\n"+t("adv")+": "+money(d.adv):"")+"\n"+(profile.phone||"");
 var ph=String(c.phone||"").replace(/\D/g,"").slice(-10);
 window.open("https://wa.me/"+(ph?"91"+ph:"")+"?text="+encodeURIComponent(txt),"_blank","noopener")}
function printQuote(q){
 var d=q.data||{},c=clientOf(q),tt=totalsOf(d),n=0;
 var rows=(d.items||[]).filter(function(i){return +i.qty>0}).map(function(i){n++;return "<tr><td>"+n+"</td><td>"+esc(i.name)+"</td><td>"+esc(i.qty)+" "+esc(i.unit)+"</td><td style='text-align:right'>"+money(i.rate)+"</td><td style='text-align:right'>"+money((+i.qty||0)*(+i.rate||0))+"</td></tr>"}).join("");
 var ex=[["labour",d.lab],["transport",d.tr]].filter(function(x){return +x[1]>0}).map(function(x){return "<tr><td></td><td colspan='3'>"+esc(t(x[0]))+"</td><td style='text-align:right'>"+money(x[1])+"</td></tr>"}).join("");
 $("print").innerHTML="<h1>"+esc(profile.firm||"CCTV")+"</h1><div>"+esc(profile.address||"")+" "+esc(profile.phone||"")+(profile.gst_no?" · GST "+esc(profile.gst_no):"")+"</div><hr><h2>"+esc(t("quote"))+"</h2><div>"+esc(t("to"))+": <b>"+esc(q.client_name||c.name||"")+"</b> "+esc(c.phone||"")+" "+esc(c.address||"")+"</div><div>"+esc(t("date"))+": "+new Date(q.created_at).toLocaleDateString("en-IN")+"</div><br><table><thead><tr><th>#</th><th>"+esc(t("item"))+"</th><th>"+esc(t("qty"))+"</th><th>"+esc(t("rate"))+"</th><th>"+esc(t("amt"))+"</th></tr></thead><tbody>"+rows+ex+"</tbody></table><p style='text-align:right'>"+esc(t("sub"))+": "+money(tt.sub+(+d.lab||0)+(+d.tr||0))+(+d.dis?" · "+esc(t("discount"))+": -"+money(d.dis):"")+(+d.gp?" · GST "+d.gp+"%: "+money(tt.gst):"")+"<br><b style='font-size:18px'>"+esc(t("grand"))+": "+money(tt.total)+"</b>"+(+d.adv?"<br>"+esc(t("adv"))+": "+money(d.adv)+" · "+esc(t("bal"))+": "+money(tt.bal):"")+"</p>"+(d.note?"<p>"+esc(d.note)+"</p>":"")+"<p>"+esc(t("tc"))+"</p><br><br><div style='text-align:right'>"+esc(t("sig"))+"</div>";
 setTimeout(function(){window.print()},60)}

/* ---- clients ---- */
function renderClients(editC){
 var e=editC||{};
 var h='<div class="card"><h3>'+esc(e.id?t("edit"):t("addCli"))+'</h3><div class="grid" style="margin-top:8px"><div><label>'+t("name")+'</label><input id="k-name" value="'+esc(e.name||"")+'"></div><div><label>'+t("phone")+'</label><input id="k-ph" inputmode="tel" value="'+esc(e.phone||"")+'"></div><div><label>'+t("addr")+'</label><input id="k-ad" value="'+esc(e.address||"")+'"></div></div><div class="row" style="margin-top:10px"><button class="btn p" id="k-save">'+t("save")+'</button>'+(e.id?'<button class="btn" id="k-cancel">'+t("cancel")+'</button>':'')+'</div></div>';
 h+=clients.length?"":'<div class="card mut">'+esc(t("noCli"))+'</div>';
 h+=clients.map(function(c){return '<div class="card"><div class="row"><b>'+esc(c.name)+'</b><span class="sp"></span><span class="mut">'+esc(c.phone)+'</span></div><div class="mut">'+esc(c.address)+'</div><div class="row" style="margin-top:8px">'+(c.phone?'<a class="btn s g" style="text-decoration:none" href="tel:'+esc(c.phone)+'">'+t("call")+'</a>':'')+'<button class="btn s" data-e="'+c.id+'">'+t("edit")+'</button><button class="btn s d" data-d="'+c.id+'">'+t("del")+'</button></div></div>'}).join("");
 $("v-cli").innerHTML=h;
 $("k-save").onclick=async function(){var name=$("k-name").value.trim();if(!name)return;var row={owner:me,name:name,phone:$("k-ph").value.trim(),address:$("k-ad").value.trim()};
  if(e.id)await sb.from("promate_web_client").update(row).eq("id",e.id);else await sb.from("promate_web_client").insert(row);await loadAll();renderClients()};
 if($("k-cancel"))$("k-cancel").onclick=function(){renderClients()};
 each("#v-cli [data-e]",function(b){b.onclick=function(){renderClients(clients.find(function(c){return c.id===b.dataset.e}))}});
 each("#v-cli [data-d]",function(b){b.onclick=async function(){if(armed!==b.dataset.d){armed=b.dataset.d;b.textContent=t("sure");return}armed=null;await sb.from("promate_web_client").delete().eq("id",b.dataset.d);await loadAll();renderClients()}})}

function renderProfile(){
 $("v-prof").innerHTML='<div class="card"><div class="grid"><div><label>'+t("firm")+'</label><input id="p-firm" value="'+esc(profile.firm)+'"></div><div><label>'+t("phone")+'</label><input id="p-ph" inputmode="tel" value="'+esc(profile.phone)+'"></div><div><label>'+t("addr")+'</label><input id="p-ad" value="'+esc(profile.address)+'"></div><div><label>'+t("gstno")+'</label><input id="p-gst" value="'+esc(profile.gst_no)+'"></div></div><div class="row" style="margin-top:10px"><button class="btn p" id="p-save">'+t("save")+'</button><span id="p-ok" class="mut"></span></div></div>';
 $("p-save").onclick=async function(){var row={owner:me,firm:$("p-firm").value.trim(),phone:$("p-ph").value.trim(),address:$("p-ad").value.trim(),gst_no:$("p-gst").value.trim(),updated_at:new Date().toISOString()};
  var r=await sb.from("promate_web_profile").upsert(row);if(!r.error){profile=row;$("p-ok").textContent=t("saved")}else $("p-ok").textContent=r.error.message}}

/* ---- events ---- */
$("q-sys").onchange=function(){$("q-ipw").classList.toggle("hide",$("q-sys").value!=="HYBRID")};
$("q-client").onchange=async function(){if($("q-client").value==="__new"){var name=prompt(t("name"));if(!name){$("q-client").value="";return}var ph=prompt(t("phone"))||"";var r=await sb.from("promate_web_client").insert({owner:me,name:name.trim(),phone:ph.trim(),address:""}).select().single();await loadAll();renderClientSelect(r.data&&r.data.id)}};
$("q-build").onclick=function(){
 var inn=+$("q-in").value||0,out=+$("q-out").value||0,cams=inn+out;
 if(cams<1){$("q-err").textContent=t("need");return}
 if(cams>50){$("q-err").textContent="Max 50";return}
 $("q-err").textContent="";
 items=buildKit({cams:cams,dome:inn,sys:$("q-sys").value,ip:+$("q-ip").value||0,cab:+$("q-cab").value||22.5});
 items.forEach(function(i){var r=rates[i.name.toLowerCase()];if(r)i.rate=r});
 $("q-info").textContent=t("built");$("q-edit").classList.remove("hide");renderRows()};
$("q-add").onclick=function(){items.push({name:"",qty:1,unit:"piece",rate:""});renderRows()};
["c-lab","c-tr","c-dis","c-gst","c-adv"].forEach(function(i){$(i).oninput=renderSum;$(i).onchange=renderSum});
$("q-cancel").onclick=function(){editing=null;items=[];$("q-edit").classList.add("hide");show("list")};
$("q-save").onclick=async function(){
 if(!items.length){$("q-err").textContent=t("need");return}
 var cid=$("q-client").value;if(cid==="__new")cid="";
 var cl=clients.find(function(c){return c.id===cid});
 var data={items:items.filter(function(i){return i.name}),sys:$("q-sys").value,indoor:+$("q-in").value||0,outdoor:+$("q-out").value||0,ip:+$("q-ip").value||0,cab:+$("q-cab").value||22.5,lab:+$("c-lab").value||0,tr:+$("c-tr").value||0,dis:+$("c-dis").value||0,gp:+$("c-gst").value||0,adv:+$("c-adv").value||0,note:$("c-note").value};
 var row={owner:me,client_id:cid||null,client_name:cl?cl.name:"",data:data,total:Math.round(totalsOf(data).total*100)/100,updated_at:new Date().toISOString()};
 var r=editing?await sb.from("promate_web_quote").update(row).eq("id",editing.id):await sb.from("promate_web_quote").insert(row);
 if(r.error){$("q-err").textContent=r.error.message;return}
 editing=null;items=[];$("q-edit").classList.add("hide");await loadAll();show("list")};
$("lang").onclick=function(){lang=lang==="hi"?"en":"hi";try{localStorage.setItem("pm-web-lang",lang)}catch(e){}applyLang()};
$("out").onclick=async function(){await sb.auth.signOut();location.replace(HERE)};
$("gbtn").onclick=function(){$("lerr").textContent="";sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:HERE}}).then(function(r){if(r.error)$("lerr").textContent=r.error.message})};

async function boot(){
 applyLang();
 if(!sb){$("login").classList.remove("hide");$("lerr").textContent="Load failed. Check internet and reload.";return}
 var s=await sb.auth.getSession();var u=s.data&&s.data.session&&s.data.session.user;
 if(!u){$("login").classList.remove("hide");return}
 me=String(u.email||"").toLowerCase();$("who").textContent=me;$("out").classList.remove("hide");
 await loadAll();$("app").classList.remove("hide");applyLang();show("list");
 if(location.hash||location.search)history.replaceState(null,"",HERE)}
boot();
})();
</script>
