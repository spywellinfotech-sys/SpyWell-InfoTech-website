<style>
/* Layout: one list page (all apps with their features) and one landing page per app, switched by the URL hash. */
:root{
  --h:348;
  --bg:#faf7f8; --surface:#ffffff; --fg:#1d1519; --muted:#665a61; --line:#e6dce0;
  --accent:hsl(348 70% 40%); --on-accent:#ffffff; --tint:hsl(348 60% 94%);
  --ok:#1b7a47; --wip:#8f5a00; --soon:#665a61;
  --head:'Space Grotesk','Noto Sans Devanagari',system-ui,sans-serif;
  --body:'Inter','Noto Sans Devanagari',system-ui,sans-serif;
}
.scope{--accent:hsl(var(--h) 70% 40%); --tint:hsl(var(--h) 60% 94%)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151115; --surface:#1e181d; --fg:#f4ecef; --muted:#aa9da4; --line:#33292f;
    --accent:hsl(348 80% 68%); --on-accent:#1a0d12; --tint:hsl(348 28% 20%);
    --ok:#6fd49a; --wip:#f0b84d; --soon:#aa9da4; color-scheme:dark;
  }
  :root:not([data-theme="light"]) .scope{--accent:hsl(var(--h) 80% 68%); --tint:hsl(var(--h) 28% 20%)}
}
:root[data-theme="dark"]{
  --bg:#151115; --surface:#1e181d; --fg:#f4ecef; --muted:#aa9da4; --line:#33292f;
  --accent:hsl(348 80% 68%); --on-accent:#1a0d12; --tint:hsl(348 28% 20%);
  --ok:#6fd49a; --wip:#f0b84d; --soon:#aa9da4; color-scheme:dark;
}
:root[data-theme="dark"] .scope{--accent:hsl(var(--h) 80% 68%); --tint:hsl(var(--h) 28% 20%)}

*{box-sizing:border-box}
body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); line-height:1.65; font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.wrap{max-width:860px; margin:0 auto; padding-block:20px 40px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--head); font-weight:700; font-size:15px; letter-spacing:.02em}
.brand i{width:22px; height:22px; border-radius:6px; background:var(--accent); display:block}
h1,h2,h3{font-family:var(--head); text-wrap:balance; margin:0; line-height:1.25}
.intro{padding-block:36px 22px}
.intro h1{font-size:clamp(32px,7vw,52px); font-weight:700}
.intro p{color:var(--muted); margin:12px 0 0; max-width:52ch; font-size:17px}

.controls{display:flex; flex-direction:column; gap:14px; padding-bottom:18px}
.search{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--fg); font:inherit}
.search::placeholder{color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; font-size:14px; padding:6px 14px; border-radius:999px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}

.rows{border-top:1px solid var(--line)}
.row{display:grid; grid-template-columns:52px minmax(0,1fr); gap:16px; padding:20px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit}
.row:hover .row-name{text-decoration:underline; text-underline-offset:3px}
.mono{width:52px; height:52px; border-radius:12px; background:var(--tint); color:var(--accent); display:grid; place-items:center; font-family:var(--head); font-weight:700; font-size:18px}
.row-head{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px}
.row-name{font-family:var(--head); font-weight:700; font-size:19px}
.row-sub{color:var(--muted); font-size:15px; margin:2px 0 0}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tag{font-size:12.5px; padding:2px 9px; border-radius:6px; border:1px solid var(--line); color:var(--muted)}
.pill{font-size:12px; font-weight:600; padding:1px 9px; border-radius:999px; border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.wip{color:var(--wip)} .pill.soon{color:var(--soon)}
.empty{padding:28px 0; color:var(--muted)}

.back{display:inline-block; margin-top:22px; font-size:15px; color:var(--muted); text-decoration:none}
.back:hover{color:var(--fg)}
.hero{display:grid; grid-template-columns:84px minmax(0,1fr); gap:20px; padding-block:26px 8px; align-items:start}
.hero .mono{width:84px; height:84px; border-radius:20px; font-size:30px}
.hero h1{font-size:clamp(32px,7vw,48px); font-weight:700}
.hero .tl{font-size:19px; color:var(--muted); margin:6px 0 0; max-width:46ch}
.hero .pill{display:inline-block; margin-top:12px}
.actions{display:flex; flex-wrap:wrap; gap:10px; padding-block:20px 6px}
.btn{display:inline-flex; align-items:center; min-height:46px; padding:0 20px; border-radius:10px; background:var(--accent); color:var(--on-accent); text-decoration:none; font-weight:600}
.btn.ghost{background:transparent; color:var(--fg); border:1px solid var(--line)}
.note{color:var(--muted); font-size:14.5px; margin:8px 0 0}
h2.sec{font-size:24px; margin:34px 0 4px}
.feats{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); gap:0 32px}
.feat{padding:16px 0; border-top:1px solid var(--line); min-width:0}
.feat h3{font-size:17px; font-weight:600}
.feat p{margin:4px 0 0; color:var(--muted); font-size:15px}
.aud{margin-top:30px; padding:18px 20px; border-radius:12px; background:var(--tint)}
.aud b{font-family:var(--head); display:block; margin-bottom:2px}
.aud span{display:block; margin-top:6px; font-size:15px}
.pn{display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; margin-top:34px; padding-top:18px; border-top:1px solid var(--line); font-size:15px}
.pn a{text-decoration:none; color:var(--muted)} .pn a:hover{color:var(--fg)}
.pn a b{display:block; color:var(--fg); font-family:var(--head)}
.foot{margin-top:30px; font-size:14px; color:var(--muted)}
@media (max-width:520px){
  .hero{grid-template-columns:1fr}
  .row{grid-template-columns:44px minmax(0,1fr); gap:14px}
  .mono{width:44px; height:44px; font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

var root = document.getElementById("root");
var state = {cat:"all", q:""};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function pill(a){return '<span class="pill '+a.s+'">'+ST[a.s]+'</span>';}
function catName(k){for(var i=0;i<CATS.length;i++){if(CATS[i][0]===k)return CATS[i][1];}return "";}

function rowHtml(a){
  var tags = a.f.slice(0,3).map(function(f){return '<span class="tag">'+esc(f[0])+'</span>';}).join("");
  var more = a.f.length>3 ? '<span class="tag">+'+(a.f.length-3)+' और</span>' : "";
  return '<a class="row scope" style="--h:'+a.h+'" href="#'+a.id+'">'+
    '<div class="mono" aria-hidden="true">'+esc(a.m)+'</div>'+
    '<div><div class="row-head"><span class="row-name">'+esc(a.n)+'</span>'+pill(a)+'</div>'+
    '<p class="row-sub">'+esc(a.t)+'</p><div class="tags">'+tags+more+'</div></div></a>';
}

function fillRows(){
  var q = state.q.trim().toLowerCase();
  var list = APPS.filter(function(a){
    if(state.cat!=="all" && a.c!==state.cat) return false;
    if(!q) return true;
    var hay = (a.n+" "+a.t+" "+a.f.map(function(f){return f[0]+" "+f[1];}).join(" ")).toLowerCase();
    return hay.indexOf(q)>-1;
  });
  var el = document.getElementById("rows");
  el.innerHTML = list.length ? list.map(rowHtml).join("") : '<div class="empty">कोई ऐप नहीं मिला। दूसरा शब्द या दूसरी श्रेणी आज़माएँ।</div>';
  document.getElementById("count").textContent = list.length+" ऐप";
}

function renderList(){
  root.innerHTML =
    '<a class="brand" href="../" style="text-decoration:none"><i></i>SpyWell InfoTech</a>'+
    '<header class="intro"><h1>हमारे सभी ऐप्स</h1><p>हर ऐप का अपना पेज है। नाम पर टैप करें और उसके सारे फीचर देखें। <span id="count"></span></p></header>'+
    '<div class="controls"><input class="search" id="q" type="search" placeholder="ऐप या फीचर खोजें, जैसे quotation, बैटरी, दुकान" value="'+esc(state.q)+'">'+
    '<div class="chips" id="chips">'+CATS.map(function(c){return '<button type="button" class="chip" data-c="'+c[0]+'" aria-pressed="'+(state.cat===c[0])+'">'+c[1]+'</button>';}).join("")+'</div></div>'+
    '<div class="rows" id="rows"></div>'+
    '<p class="foot">© SpyWell InfoTech · संपर्क: spywellinfotech@gmail.com</p>';
  document.getElementById("q").addEventListener("input", function(e){state.q=e.target.value; fillRows();});
  document.getElementById("chips").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    state.cat = b.getAttribute("data-c");
    var all = document.querySelectorAll("#chips .chip");
    for(var i=0;i<all.length;i++){all[i].setAttribute("aria-pressed", String(all[i]===b));}
    fillRows();
  });
  fillRows();
}

function renderApp(idx){
  var a = APPS[idx], prev = APPS[(idx-1+APPS.length)%APPS.length], next = APPS[(idx+1)%APPS.length];
  var action;
  if(a.s==="ok"){
    action = '<div class="actions"><a class="btn" href="'+(a.dl||REL)+'" target="_blank" rel="noopener">APK डाउनलोड करें</a><a class="btn ghost" href="#">सभी ऐप्स देखें</a>'+(a.lp?'<a class="btn ghost" href="'+a.lp+'">पूरा पेज देखें</a>':"")+'</div>';
  } else if(a.s==="wip"){
    action = '<div class="actions"><a class="btn ghost" href="#">सभी ऐप्स देखें</a></div><p class="note">यह ऐप अभी बन रहा है। डाउनलोड तैयार होते ही यहीं मिलेगा।</p>';
  } else {
    action = '<div class="actions"><a class="btn ghost" href="#">सभी ऐप्स देखें</a></div><p class="note">यह ऐप जल्द आ रहा है।</p>';
  }
  var feats = a.f.map(function(f){return '<div class="feat"><h3>'+esc(f[0])+'</h3><p>'+esc(f[1])+'</p></div>';}).join("");
  var extra = a.x ? '<span>'+esc(a.x)+'</span>' : "";
  root.innerHTML =
    '<div class="scope" style="--h:'+a.h+'">'+
    '<a class="brand" href="../" style="text-decoration:none"><i></i>SpyWell InfoTech</a>'+
    '<a class="back" href="#">← सभी ऐप्स</a>'+
    '<section class="hero"><div class="mono" aria-hidden="true">'+esc(a.m)+'</div><div><h1>'+esc(a.n)+'</h1><p class="tl">'+esc(a.t)+'</p>'+pill(a)+'</div></section>'+
    action+
    '<h2 class="sec">मुख्य फीचर्स</h2><div class="feats">'+feats+'</div>'+
    '<div class="aud"><b>किसके लिए</b>'+esc(a.w)+extra+'</div>'+
    '<nav class="pn"><a href="#'+prev.id+'"><b>← '+esc(prev.n)+'</b>पिछला ऐप</a><a href="#'+next.id+'" style="text-align:right"><b>'+esc(next.n)+' →</b>अगला ऐप</a></nav>'+
    '<p class="foot">© SpyWell InfoTech · संपर्क: spywellinfotech@gmail.com</p></div>';
}

function route(){
  var id = location.hash.replace("#","");
  var idx = -1;
  for(var i=0;i<APPS.length;i++){if(APPS[i].id===id){idx=i;break;}}
  if(idx>-1){renderApp(idx);} else {renderList();}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
