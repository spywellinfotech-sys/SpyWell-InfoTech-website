<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>SpyWell Card</title>
<style>
:root{--wine:#8b1a2b;--ink:#2b1a14;--bg:#fdf6e8;--line:#e8d5ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Hind,Poppins,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:auto;padding:16px}
h1{font-size:21px;color:var(--wine);margin:8px 0}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;text-align:center}
input,button,a.btn{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);width:100%;display:block;margin-top:10px;text-align:center;text-decoration:none}
button,a.btn{background:var(--wine);color:#fff;border:0;font-weight:600;cursor:pointer}
a.alt{background:#fff;color:var(--wine);border:1px solid var(--wine)}
#err{color:#b00020;margin-top:8px;min-height:20px}
#pages canvas{width:100%;height:auto;display:block;margin:0 0 12px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff}
.ft{text-align:center;color:#7a6248;font-size:12px;margin:18px 0}
[hidden]{display:none!important}
.tc{background:#fffaf0;border:3px double #c9a24a;border-radius:16px;padding:26px 18px;text-align:center;box-shadow:0 2px 14px rgba(0,0,0,.15)}
.tc .gn{font-size:15px;color:#8b1a2b;letter-spacing:1px}.tc h2{margin:6px 0;font-size:30px;line-height:1.25;color:#8b1a2b}
.tc .amp{font-size:22px;color:#c9a24a;margin:0}.tc p{margin:8px 0}.tc .dt{font-size:20px;font-weight:700;margin:14px 0 2px}
.tc hr{border:0;border-top:1px solid #e8d5ad;margin:16px 30px}.tc a.b{display:block;margin:8px 0;padding:11px;border-radius:10px;background:#8b1a2b;color:#fff;text-decoration:none;font-weight:600}
.tc a.b.o{background:#fff;color:#8b1a2b;border:1px solid #8b1a2b}
</style></head><body><div class="wrap">
<div id="msg" class="box">लोड हो रहा है…</div>

<div id="gate" class="box" hidden>
<h1 id="gtitle">आपका स्वागत है</h1>
<div>कार्ड देखने के लिए अपना नाम और मोबाइल नंबर लिखें</div>
<form id="gf"><input id="gn" placeholder="आपका नाम" autocomplete="name" maxlength="60">
<input id="gp" placeholder="मोबाइल नंबर (10 अंक)" inputmode="numeric" maxlength="10" autocomplete="tel">
<div id="err"></div><button type="submit">कार्ड खोलें</button></form></div>

<div id="view" hidden>
<div id="pages"></div>
<a id="dl" class="btn" data-ev="pdf" download>PDF सेव करें</a>
<a id="wa" class="btn alt" data-ev="whatsapp" target="_blank" rel="noopener">WhatsApp पर भेजें</a>
</div>
<div class="ft">SpyWell InfoTech · spywell.in<br><a id="insl" href="#" style="color:#8b6b3a">इनसाइट देखें (PIN से)</a></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
var B='https://rxhanrtoaplwphmwpgqg.supabase.co',K='sb_publishable_C76zU42qscFbBnfOcn5Zew_1VcRcL4d';
var id=(location.search.match(/[?&]id=([\w-]+)/)||[])[1]||'';
var $=function(x){return document.getElementById(x)};
function ls(k,x){try{if(x===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,x)}catch(e){return ''}}
var v=ls('cv');if(!v){v=Math.random().toString(36).slice(2,12);ls('cv',v)}
var gn=ls('gn'),gp=ls('gp'),dev=/Mobi|Android|iPhone/i.test(navigator.userAgent)?'mobile':'desktop',ref='';
try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(e){}
function t(ev){try{fetch(B+'/rest/v1/card_events',{method:'POST',keepalive:true,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({card:id,event:ev,visitor:v,ref:ref,device:dev,guest_name:gn,guest_phone:gp})})}catch(e){}}
function msg(h){$('msg').hidden=false;$('msg').innerHTML=h}
document.addEventListener('click',function(e){var a=e.target.closest('[data-ev]');if(a)t(a.getAttribute('data-ev'))});
if(!id){msg('<h1>लिंक सही नहीं है</h1>कृपया भेजने वाले से सही लिंक माँगें।');return}
fetch(B+'/rest/v1/rpc/card_get',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_slug:id})})
.then(function(r){return r.json()}).then(function(d){
 if(!d||d.error){msg('<h1>कार्ड नहीं मिला</h1>लिंक गलत है या हटा दिया गया है।');return}
 if(d.kind==='template'&&!d.expired){location.replace('/wedding-t/?id='+encodeURIComponent(id));return}
 if(d.expired){msg('<h1>यह कार्ड अब उपलब्ध नहीं है</h1>इस कार्ड की वैधता समाप्त हो चुकी है।');return}
 document.title=d.title||'SpyWell Card';
 var pdf=d.pdf_path?B+'/storage/v1/object/public/cards/'+d.pdf_path:'';
 $('dl').href=pdf;$('insl').href='/card-insights/?c='+encodeURIComponent(id);
 $('wa').href='https://wa.me/?text='+encodeURIComponent((d.title?d.title+'\n':'')+location.href);
 function E(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function tpl(x){
  var dt='';try{dt=new Date(x.date+'T00:00:00').toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){}
  var h='<div class="tc"><div class="gn">॥ श्री गणेशाय नमः ॥</div><p>शुभ विवाह</p><h2>'+E(x.groom)+'</h2><p class="amp">संग</p><h2>'+E(x.bride)+'</h2>';
  if(x.groom_father||x.bride_father)h+='<p>'+(x.groom_father?'पुत्र श्री '+E(x.groom_father):'')+(x.groom_father&&x.bride_father?' · ':'')+(x.bride_father?'पुत्री श्री '+E(x.bride_father):'')+'</p>';
  h+='<hr><p>आप सपरिवार सादर आमंत्रित हैं</p><div class="dt">'+E(dt)+'</div>'+(x.time?'<div>'+E(x.time)+'</div>':'');
  h+='<p><b>'+E(x.venue)+'</b>'+(x.address?'<br>'+E(x.address):'')+'</p>';
  if(x.note)h+='<p>'+E(x.note)+'</p>';
  h+='<hr>';
  if(x.maps)h+='<a class="b o" data-ev="maps" target="_blank" rel="noopener" href="'+E(x.maps)+'">📍 Google Maps पर जगह देखें</a>';
  if(x.call1)h+='<a class="b" data-ev="call1" href="tel:+91'+E(x.call1)+'">📞 '+E(x.call1_name||'कॉल करें')+'</a>';
  if(x.call2)h+='<a class="b" data-ev="call2" href="tel:+91'+E(x.call2)+'">📞 '+E(x.call2_name||'कॉल करें')+'</a>';
  return h+'</div>'}
 function show(){
  $('gate').hidden=true;$('msg').hidden=true;$('view').hidden=false;t('view');
  if(d.kind==='template'){$('pages').innerHTML=tpl(d.data||{});$('dl').hidden=true;return}
  if(!window.pdfjsLib){$('pages').innerHTML='<a class="btn" href="'+pdf+'">कार्ड खोलें (PDF)</a>';return}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument(pdf).promise.then(function(doc){
   var chain=Promise.resolve();
   for(var i=1;i<=doc.numPages;i++)(function(n){chain=chain.then(function(){return doc.getPage(n).then(function(pg){
    var vp0=pg.getViewport({scale:1}),w=Math.min(window.innerWidth-32,560),sc=(w/vp0.width)*(window.devicePixelRatio||1),vp=pg.getViewport({scale:sc});
    var c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;$('pages').appendChild(c);
    return pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise})})})(i);
  }).catch(function(){$('pages').innerHTML='<a class="btn" href="'+pdf+'">कार्ड खोलें (PDF)</a>'});
 }
 if(d.kind==='visiting'){show();return}
 $('msg').hidden=true;$('gate').hidden=false;
 if(d.title)$('gtitle').textContent=d.title;
 $('gf').addEventListener('submit',function(e){e.preventDefault();
  var n=$('gn').value.trim(),p=$('gp').value.replace(/\D/g,'');
  if(n.length<2){$('err').textContent='कृपया अपना नाम लिखें';return}
  if(!/^[6-9]\d{9}$/.test(p)){$('err').textContent='सही 10 अंकों का मोबाइल नंबर डालें';return}
  gn=n;gp=p;ls('gn',n);ls('gp',p);show()});
}).catch(function(){msg('<h1>नेटवर्क दिक्कत</h1>कृपया दोबारा कोशिश करें।')});
})();
</script></body></html>
