<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="डिजिटल वेडिंग कार्ड का इनसाइट पेज, सैंपल डेटा के साथ। SpyWell InfoTech">
<title>Card Insights सैंपल | SpyWell InfoTech</title>
<style>
:root{--wine:#8b1a2b;--ink:#2b1a14;--bg:#fdf6e8;--line:#e8d5ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Hind,Poppins,system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:21px;color:var(--wine);margin:6px 0 2px}small{color:#7a6248}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.n{font-size:30px;font-weight:700;color:var(--wine);line-height:1.1}
.k{font-size:12.5px;color:#7a6248}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);width:100%}button{background:var(--wine);color:#fff;border:0;font-weight:600;margin-top:8px}
.bar{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}.bar div{flex:1;background:var(--wine);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bar span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}a{color:var(--wine)}.ln:last-child{border:0}
#err{color:#b00020;margin-top:8px}
</style></head><body>
<h1>Card Insights</h1><small>आदित्य और सोनाली का वेडिंग कार्ड</small><div class="card" style="background:#fff4dc;font-size:14px">यह सिर्फ़ सैंपल है। नाम और नंबर काल्पनिक हैं। आपके कार्ड का इनसाइट ऐसा ही दिखेगा, सिर्फ़ आपके पास PIN के साथ।</div>
<div id="login" hidden><div id="err"></div></div>
<div id="out" hidden></div>
<script>
function iso(h){return new Date(Date.now()-h*3600e3).toISOString()}
var D={views:86,visitors:41,today:12,clicks:{maps:23,call1:14,call2:6,pdf:9,jpg:5,whatsapp:11,order:2},
days:[3,5,4,8,6,9,7,5,11,8,6,10,9,12].map(function(v,i){var d=new Date(Date.now()-(13-i)*864e5);return{d:d.toISOString().slice(0,10),v:v}}),
devices:{mobile:78,desktop:8},sources:{'Direct / WhatsApp':71,'facebook.com':9,'google.com':6},
guests:[{n:'राजेश वर्मा',p:'9876500011',v:4,k:3,t:iso(1)},{n:'सुनीता देवी',p:'9876500022',v:2,k:2,t:iso(3)},{n:'अमित कुमार',p:'9876500033',v:3,k:1,t:iso(5)},{n:'पूजा शर्मा',p:'9876500044',v:1,k:0,t:iso(9)},{n:'मनोज चौहान',p:'9876500055',v:2,k:2,t:iso(26)}],
recent:[{t:iso(1),e:'maps',n:'राजेश वर्मा'},{t:iso(1.1),e:'view',n:'राजेश वर्मा'},{t:iso(3),e:'call1',n:'सुनीता देवी'},{t:iso(3.2),e:'view',n:'सुनीता देवी'},{t:iso(5),e:'pdf',n:'अमित कुमार'},{t:iso(9),e:'view',n:'पूजा शर्मा'}]};
var L={call1:'पहले नंबर पर कॉल',call2:'दूसरे नंबर पर कॉल',maps:'Google Maps',pdf:'PDF सेव',jpg:'फ़ोटो सेव',whatsapp:'WhatsApp शेयर',order:'SpyWell ऑर्डर बटन',view:'कार्ड खुला'};
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){(function(d){
  if(!d||d.error){document.getElementById('err').textContent='PIN गलत है';return}
  document.getElementById('login').hidden=true;var o=document.getElementById('out');o.hidden=false;
  var mx=Math.max.apply(null,d.days.map(function(x){return x.v}).concat([1]));
  var h='<div class="card"><div class="row"><div><div class="n">'+d.views+'</div><div class="k">कुल व्यू</div></div><div><div class="n">'+d.visitors+'</div><div class="k">अलग लोग</div></div><div><div class="n">'+d.today+'</div><div class="k">आज</div></div></div></div>';
  h+='<div class="card"><b>पिछले 14 दिन</b><div class="bar">'+d.days.map(function(x){return'<div style="height:'+Math.round(x.v/mx*100)+'%"><span>'+x.v+'</span></div>'}).join('')+'</div></div>';
  h+='<div class="card"><b>किसने खोला ('+d.guests.length+')</b>'+(d.guests.map(function(g){var t=new Date(g.t).toLocaleString('hi-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});return'<div class="ln"><span>'+esc(g.n)+'<br><a href="tel:+91'+esc(g.p)+'">'+esc(g.p)+'</a></span><small style="text-align:right">'+g.v+' बार खोला<br>'+g.k+' क्लिक<br>'+t+'</small></div>'}).join('')||'<div class="k">अभी किसी ने नहीं खोला</div>')+'</div>';
  h+='<div class="card"><b>बटन क्लिक</b>'+(Object.keys(d.clicks).map(function(k){return'<div class="ln"><span>'+esc(L[k]||k)+'</span><b>'+d.clicks[k]+'</b></div>'}).join('')||'<div class="k">अभी कोई क्लिक नहीं</div>')+'</div>';
  h+='<div class="card"><b>फ़ोन / कंप्यूटर</b>'+Object.keys(d.devices).map(function(k){return'<div class="ln"><span>'+esc(k)+'</span><b>'+d.devices[k]+'</b></div>'}).join('')+'</div>';
  h+='<div class="card"><b>कहाँ से आए</b>'+Object.keys(d.sources).map(function(k){return'<div class="ln"><span>'+esc(k)+'</span><b>'+d.sources[k]+'</b></div>'}).join('')+'</div>';
  h+='<div class="card"><b>ताज़ा गतिविधि</b>'+d.recent.map(function(x){var t=new Date(x.t).toLocaleString('hi-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});return'<div class="ln"><span>'+esc(x.n||'अज्ञात')+' : '+esc(L[x.e]||x.e)+'</span><small>'+t+'</small></div>'}).join('')+'</div>';
  o.innerHTML=h})(D)}
load();
</script></body></html>
