<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Print Card · LiveCard Admin</title><link rel="icon" href="/studio/vicard-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7f4;color:#1c1414;font:16px/1.5 Hind,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#7a0a10,#d4141c);color:#fff}
.bar a{color:#fff;text-decoration:none;border:1.5px solid rgba(255,255,255,.7);border-radius:99px;padding:7px 14px;font-weight:700}
.bar b{font:800 19px "Baloo 2",sans-serif;flex:1}
main{max-width:640px;margin:0 auto;padding:12px 12px 40px}
input[type=search]{width:100%;font:16px Hind,sans-serif;padding:10px 12px;border-radius:12px;border:1.5px solid #ecd3cf;margin:4px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.chip{flex:none;border:1.5px solid #ecd3cf;background:#fff;color:#1c1414;border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px;min-height:36px}.chip.on{background:#d4141c;color:#fff;border-color:#d4141c}
.day{background:#fff;border:1px solid #f0dcd8;border-radius:14px;margin-bottom:10px;overflow:hidden}
.dh{padding:10px 12px;background:#fff1ee;border-bottom:1px solid #f3e3e0}.dh b{font-size:16px}.dh .c{font-size:13px;color:#6d6060}
.dh button{margin-top:8px;width:100%}
.r{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid #f6ecea}.r:first-of-type{border-top:0}
.r .t{flex:1;min-width:0}.r b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r .m{font-size:12px;color:#6d6060;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk{flex:none;border:1.5px solid #ddd;background:#fff;color:#888;border-radius:10px;padding:4px 6px;font:700 12px Hind,sans-serif;min-width:52px;text-align:center;line-height:1.15;cursor:pointer}
.tk.on{background:#0f9d8a;border-color:#0f9d8a;color:#fff}.tk.d.on{background:#2f6fde;border-color:#2f6fde}.tk.n.on{background:#7a3cc8;border-color:#7a3cc8}.tk{min-width:46px;padding:4px 4px}
.ib{flex:none;border:0;background:#f3eeee;border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer;padding:0}
button.main{font:700 15px Hind,sans-serif;border-radius:10px;border:0;padding:10px 12px;cursor:pointer;background:#d4141c;color:#fff;min-height:44px}button:disabled{opacity:.6}
.mut{color:#6d6060;font-size:14px}.msg{font-size:14px;padding:0 12px 10px}
</style></head><body>
<div class="bar"><a href="/studio/admin/">← Admin</a><b>🖨️ Print Card</b></div>
<main id="m"><p class="mut">लोड हो रहा है…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/studio/qr.js"></script><script src="/studio/printcard.js?v=10"></script>
<script>
(async function(){
var $=function(i){return document.getElementById(i)},m=$('m');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var sb=window.supabase.createClient('https://rxhanrtoaplwphmwpgqg.supabase.co','sb_publishable_C76zU42qscFbBnfOcn5Zew_1VcRcL4d',{auth:{storageKey:'spywell-studio-auth'}});
var a=await sb.rpc('studio_is_admin');if(!a||a.data!==true){m.innerHTML='<p>यह पेज सिर्फ़ एडमिन के लिए है। <a href="/studio/">लॉगिन करें</a></p>';return}
var rs=await Promise.all([sb.rpc('studio_admin_link_report'),sb.rpc('studio_admin_customers',{p_search:''}),sb.from('studio_card_prints').select('design_id,printed_at,delivered_at,nfc_at')]);
var CU={};((rs[1]&&rs[1].data)||[]).forEach(function(c){if(c.email)CU[String(c.email).toLowerCase()]=c});
var L=((rs[0]&&rs[0].data)||[]).filter(function(x){return x.product_type==='visiting'&&x.status==='published'&&x.slug}).map(function(x){var c=CU[String(x.email||'').toLowerCase()]||{};x.reg=c.created_at||x.published_at;x.phone=c.phone||'';x.cname=c.full_name||'';return x});
var PR={};((rs[2]&&rs[2].data)||[]).forEach(function(r){PR[r.design_id]=r});
function dkey(t){try{return new Date(t).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})}catch(e){return ''}}
function dlab(k){var today=dkey(new Date()),y=dkey(new Date(Date.now()-864e5));var l=new Date(k+'T12:00:00').toLocaleDateString('hi-IN',{day:'numeric',month:'short',year:'numeric'});return l+(k===today?' (आज)':k===y?' (कल)':'')}
function sd(t){try{return new Date(t).toLocaleDateString('hi-IN',{day:'numeric',month:'short'})}catch(e){return ''}}
var FLT='pp',SEL={};
m.innerHTML='<p class="mut">ग्राहक जिस दिन जुड़े उस दिन के डिब्बे में; जो ☑ चुनें वही एक PDF में (आगे-पीछे, 54 × 86 mm)। ✓ लगाएँ: 🖨️ प्रिंट, 📦 डिलीवर, 📲 NFC। ✍️ से NFC में लिंक लिखें। 📲 वाले कार्ड पर छपाई में NFC का निशान आएगा।</p><input type="search" id="q" placeholder="🔍 नाम, मोबाइल या ईमेल खोजें" aria-label="खोजें"><div class="chips" id="ch"></div><div id="l"></div>';
function st(x,k){return !!(PR[x.design_id]&&PR[x.design_id][k])}
function chips(){var np=L.filter(function(x){return !st(x,'printed_at')}).length,nd=L.filter(function(x){return st(x,'printed_at')&&!st(x,'delivered_at')}).length;
  $('ch').innerHTML=[['pp','🖨️ प्रिंट बाकी ('+np+')'],['dd','📦 डिलीवरी बाकी ('+nd+')'],['all','सभी ('+L.length+')']].map(function(c){return '<button class="chip'+(FLT===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join('');
  [].forEach.call($('ch').querySelectorAll('[data-f]'),function(b){b.onclick=function(){FLT=b.getAttribute('data-f');chips();list()}})}
function list(){var q=$('q').value.trim().toLowerCase();
  var F=L.filter(function(x){if(FLT==='pp'&&st(x,'printed_at'))return false;if(FLT==='dd'&&(!st(x,'printed_at')||st(x,'delivered_at')))return false;return !q||((x.title||'')+' '+(x.cname||'')+' '+(x.email||'')+' '+(x.phone||'')+' '+x.slug).toLowerCase().indexOf(q)>=0});
  var G={},K=[];F.forEach(function(x){var k=dkey(x.reg);if(!G[k]){G[k]=[];K.push(k)}G[k].push(x)});K.sort().reverse();
  $('l').innerHTML=K.length?K.map(function(k,gi){var A=G[k],p=A.filter(function(x){return st(x,'printed_at')}).length,d=A.filter(function(x){return st(x,'delivered_at')}).length,pend=A.filter(function(x){return !st(x,'printed_at')}).length;
    return '<div class="day"><div class="dh"><b>📅 '+esc(dlab(k))+'</b><div class="c">'+A.length+' ग्राहक · 🖨️ '+p+'/'+A.length+' · 📦 '+d+'/'+A.length+' · 📲 '+A.filter(function(x){return st(x,'nfc_at')}).length+'/'+A.length+'</div><div style="display:flex;gap:6px;margin-top:8px"><button class="main" style="flex:none;background:#fff;color:#d4141c;border:1.5px solid #d4141c" data-sa="'+gi+'">☑ सब</button><button class="main" style="flex:1;margin:0" data-g="'+gi+'">📄 चुने हुए का PDF ('+A.filter(function(x){return SEL[x.design_id]}).length+')</button></div></div><div class="msg" id="gm'+gi+'"></div>'+
      A.map(function(x,i){var r=PR[x.design_id]||{};return '<div class="r"><input type="checkbox" style="width:22px;height:22px;margin:0;flex:none" data-c="'+esc(x.design_id)+'"'+(SEL[x.design_id]?' checked':'')+' aria-label="चुनें"><div class="t"><b>'+esc(x.title||x.cname||'—')+'</b><div class="m">'+esc([x.phone,x.email].filter(Boolean).join(' · ')||x.slug)+'</div></div>'+
        '<button class="tk'+(r.printed_at?' on':'')+'" data-k="printed_at" data-id="'+esc(x.design_id)+'">🖨️<br>'+(r.printed_at?sd(r.printed_at):'प्रिंट')+'</button>'+
        '<button class="tk d'+(r.delivered_at?' on':'')+'" data-k="delivered_at" data-id="'+esc(x.design_id)+'">📦<br>'+(r.delivered_at?sd(r.delivered_at):'डिलीवर')+'</button>'+
        '<button class="tk n'+(r.nfc_at?' on':'')+'" data-k="nfc_at" data-id="'+esc(x.design_id)+'">📲<br>'+(r.nfc_at?sd(r.nfc_at):'NFC')+'</button><button class="ib" data-n="'+esc(x.design_id)+'" aria-label="NFC में लिखें">✍️</button><button class="ib" data-u="'+esc(x.slug)+'" aria-label="लिंक कॉपी">🔗</button></div>'}).join('')+'<div class="msg" id="nm'+gi+'"></div></div>'}).join(''):'<p class="mut">यहाँ कोई कार्ड नहीं</p>';
  [].forEach.call($('l').querySelectorAll('[data-c]'),function(c){c.onchange=function(){var id=c.getAttribute('data-c');if(c.checked)SEL[id]=1;else delete SEL[id];var d=c.closest('.day'),g=d.querySelector('[data-g]'),A=G[K[+g.getAttribute('data-g')]];g.textContent='📄 चुने हुए का PDF ('+A.filter(function(x){return SEL[x.design_id]}).length+')'}});
  [].forEach.call($('l').querySelectorAll('[data-sa]'),function(b){b.onclick=function(){var A=G[K[+b.getAttribute('data-sa')]],all=A.every(function(x){return SEL[x.design_id]});A.forEach(function(x){if(all)delete SEL[x.design_id];else SEL[x.design_id]=1});list()}});
  [].forEach.call($('l').querySelectorAll('[data-g]'),function(b){b.onclick=async function(){var A=G[K[+b.getAttribute('data-g')]];var C=A.filter(function(x){return SEL[x.design_id]}).map(function(x){var y=Object.assign({},x);y.nfc=st(x,'nfc_at');return y});if(!C.length){$('gm'+b.getAttribute('data-g')).textContent='☑ पहले कार्ड चुनें';return}b.disabled=true;await LCPrint.save(C,$('gm'+b.getAttribute('data-g')),'livecard-'+K[+b.getAttribute('data-g')]+'-'+C.length);b.disabled=false}});
  [].forEach.call($('l').querySelectorAll('.tk'),function(b){b.onclick=async function(){var id=b.getAttribute('data-id'),k=b.getAttribute('data-k'),cur=PR[id]||{design_id:id};var v=cur[k]?null:new Date().toISOString();
    var row={design_id:id,printed_at:cur.printed_at||null,delivered_at:cur.delivered_at||null,nfc_at:cur.nfc_at||null,updated_at:new Date().toISOString()};row[k]=v;if(k==='delivered_at'&&v&&!row.printed_at)row.printed_at=v;
    b.disabled=true;var r=await sb.from('studio_card_prints').upsert(row,{onConflict:'design_id'});b.disabled=false;if(r.error){alert('सेव नहीं हुआ');return}PR[id]=row;chips();list()}});
  [].forEach.call($('l').querySelectorAll('[data-u]'),function(b){b.onclick=async function(){var u='https://livecard.in/v/'+b.getAttribute('data-u');try{await navigator.clipboard.writeText(u);b.textContent='✓'}catch(e){window.prompt('URL',u)}setTimeout(function(){b.textContent='🔗'},1500)}});
  [].forEach.call($('l').querySelectorAll('[data-n]'),function(b){b.onclick=function(){var x=L.filter(function(z){return z.design_id===b.getAttribute('data-n')})[0];var box=b.closest('.day').querySelector('[id^=nm]');nfc(x,function(t){box.textContent=(x.title||'')+': '+t})}})}
var NM={ok:'✅ NFC में लिख गया!',readonly:'❌ यह NFC टैग लॉक है।',small:'❌ टैग में जगह कम है।',unsupported:'❌ यह टैग सपोर्ट नहीं करता।',error:'❌ लिखा नहीं जा सका, फिर से छुआएँ।'};
async function nfc(x,pm){var u='https://livecard.in/v/'+x.slug+'?src=nfc';
  var done=async function(r){pm(NM[r]||NM.error);if(r==='ok'){var cur=PR[x.design_id]||{};var row={design_id:x.design_id,printed_at:cur.printed_at||null,delivered_at:cur.delivered_at||null,nfc_at:new Date().toISOString(),updated_at:new Date().toISOString()};await sb.from('studio_card_prints').upsert(row,{onConflict:'design_id'});PR[x.design_id]=row;chips();list()}};
  if(window.ViNative&&ViNative.writeNfc){var s0='';try{s0=ViNative.nfcState()}catch(e){}if(s0==='none'){pm('इस फ़ोन में NFC नहीं है।');return}if(s0==='off'){pm('फ़ोन की Settings में NFC चालू करें।');return}
    window.__vcNfc=function(r){done(r)};var ok=false;try{ok=ViNative.writeNfc(u)}catch(e){}if(!ok){pm('NFC शुरू नहीं हो पाया।');return}pm('📲 अब NFC कार्ड को फ़ोन के पीछे छुआएँ…');return}
  if('NDEFReader' in window){pm('📲 अब NFC कार्ड को फ़ोन के पीछे छुआएँ…');try{var rd=new NDEFReader();await rd.write({records:[{recordType:'url',data:u}]});done('ok')}catch(e){done('error')}return}
  pm('NFC के लिए LiveCard ऐप 1.0.111+ या Android Chrome चाहिए।')}
$('q').oninput=list;chips();list();
})();
</script></body></html>
