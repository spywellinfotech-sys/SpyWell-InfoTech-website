<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buy Leads | LiveCard</title><meta name="robots" content="noindex">
<link rel="icon" href="/studio/vicard-icon.png">
<style>
:root{--wine:#d4141c;--ink:#1a1212;--bg:#fbf5f4;--line:#f0d6d4;--mut:#6e5b5b;--grn:#1ea952}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Hind,Poppins,system-ui,sans-serif;padding-bottom:30px}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#b30e15,#ef3b34);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.55);border-radius:10px;padding:6px 12px}
.wrap{max-width:560px;margin:auto;padding:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:56px;z-index:40;background:var(--bg);padding:8px 0}
.tabs button{margin:0;padding:9px 2px;border:1.5px solid var(--wine);border-radius:12px;background:#fff;color:var(--wine);font:700 13px inherit;cursor:pointer;line-height:1.2}.tabs button.on{background:var(--wine);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
button.p{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--wine);color:#fff;font:700 16px inherit;cursor:pointer}button.p:disabled{opacity:.6}
.k{font-size:13px;color:var(--mut)}.e{color:#b00020;font-size:14px;margin-top:8px}.ok{color:#0a7a3b;font-size:14px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{margin:0;padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;font:600 13px inherit;cursor:pointer}.chips button.on{background:#fff0ef;border-color:var(--wine);color:var(--wine)}
.ld b.t{font-size:18px;display:block;word-break:break-word}.ld .m{margin-top:2px;font-size:14px;color:var(--mut)}.ld .d{margin-top:6px;font-size:15px;word-break:break-word}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;margin:6px 6px 0 0;background:#fff3d6;color:#8a5a00}.tag.g{background:#e3f7ea;color:#0a7a3b}.tag.r{background:#fde4e4;color:#b00020}
.go{display:flex;gap:8px;margin-top:10px}.go a,.go button{flex:1;text-align:center;margin:0;padding:11px 6px;border-radius:12px;text-decoration:none;font:700 15px inherit;border:0;cursor:pointer}
.go .o{background:var(--wine);color:#fff}.go .c{background:#fff;color:var(--wine);border:1.5px solid var(--wine)}.go .w{background:var(--grn);color:#fff}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.flt input{padding:10px}
[hidden]{display:none!important}
/*desk-v1*/@media(min-width:1000px){.wrap{max-width:900px}}</style>
<script>window.I18N_PICKER=false</script><script src="/studio/i18n-data.js?v=20261128a"></script><script src="/studio/i18n-extra.js?v=20261128b"></script><script src="/studio/i18n.js?v=20261128a"></script><script src="/studio/appback.js"></script></head><body>
<div class="top"><b>🎯 Buy Leads</b><a href="/studio/">← होम</a></div>
<div class="wrap">
<div id="gate" class="card" hidden><b>पहले लॉगिन करें</b><div class="k" style="margin:6px 0 0">Buy Leads देखने और ज़रूरत डालने के लिए LiveCard में लॉगिन ज़रूरी है।</div><a href="/studio/" class="p" style="display:block;text-align:center;text-decoration:none;margin-top:12px;padding:13px;border-radius:12px;background:var(--wine);color:#fff;font-weight:700">लॉगिन / होम खोलें</a></div>
<div id="app" hidden>
<div class="tabs" id="tabs"><button data-t="browse" class="on">🎯 लीड देखें</button><button data-t="post">➕ ज़रूरत डालें</button><button data-t="mine">📝 मेरी ज़रूरतें</button><button data-t="opened">🔓 खोली हुई</button></div>
<div id="fr" class="k" style="margin:2px 2px 0"></div>

<div id="p-browse">
 <div class="card"><div class="flt"><input id="f-city" placeholder="शहर (जैसे: सहारनपुर)" maxlength="40"><input id="f-cat" placeholder="क्या चाहिए (जैसे: चारकोल)" maxlength="40"></div><button class="p" id="f-go" type="button">🔍 खोजें</button></div>
 <div id="l-browse"></div>
</div>

<div id="p-post" hidden><div class="card">
 <b style="font-size:18px">आपको क्या चाहिए?</b><div class="k">आपकी ज़रूरत सही बेचने वालों तक जाएगी। आपका नंबर तभी दिखेगा जब कोई बेचने वाला लीड खोलेगा।</div>
 <label>ज़रूरत (छोटा शीर्षक) *</label><input id="a-title" maxlength="120" placeholder="जैसे: चारकोल 1 टन चाहिए">
 <label>श्रेणी</label><div class="chips" id="a-chips"></div>
 <div class="flt"><div><label>मात्रा</label><input id="a-qty" maxlength="60" placeholder="1 टन / 50 पीस"></div><div><label>शहर</label><input id="a-city" maxlength="60" placeholder="सहारनपुर"></div></div>
 <label>ब्योरा (खाली छोड़ सकते हैं)</label><textarea id="a-det" rows="3" maxlength="500" placeholder="कैसा माल, कब तक, बजट आदि"></textarea>
 <div class="flt"><div><label>आपका नाम</label><input id="a-name" maxlength="60"></div><div><label>मोबाइल *</label><input id="a-mob" inputmode="numeric" maxlength="12" placeholder="9876543210"></div></div>
 <label>कितने दिन तक चालू रहे</label><select id="a-days"><option value="7">7 दिन</option><option value="15" selected>15 दिन</option><option value="30">30 दिन</option></select>
 <div class="e" id="a-err"></div><div class="ok" id="a-ok"></div>
 <button class="p" id="a-go" type="button">📨 ज़रूरत भेजें</button>
</div></div>

<div id="p-mine" hidden><div id="l-mine"></div></div>
<div id="p-opened" hidden><div id="l-opened"></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var sb=null,ME=null,CATS=['चारकोल','किराना','कपड़े','इलेक्ट्रॉनिक्स','निर्माण सामग्री','खाने-पीने का सामान','सेवाएँ','अन्य'],CAT='';
function ago(s){var d=(Date.now()-new Date(s).getTime())/60000;if(d<60)return Math.max(1,Math.round(d))+' मिनट पहले';if(d<1440)return Math.round(d/60)+' घंटे पहले';return Math.round(d/1440)+' दिन पहले'}
function left(s){var d=Math.ceil((new Date(s).getTime()-Date.now())/86400000);return d>0?d+' दिन बाकी':'खत्म होने वाली'}
function wa(m,t){return 'https://wa.me/91'+m+'?text='+encodeURIComponent(t)}
function contact(box,l,nm,mob){box.textContent='';var n=mk('div','',(nm||'ग्राहक')+' · +91 '+mob);n.style.cssText='font-weight:700;margin-top:10px;font-size:17px';box.appendChild(n);
  var g=mk('div','go'),c=mk('a','o','📞 कॉल');c.href='tel:+91'+mob;var w=mk('a','w','💬 WhatsApp');w.href=wa(mob,'नमस्ते, LiveCard पर आपकी ज़रूरत "'+l.title+'" देखी। मैं मदद कर सकता हूँ।');w.target='_blank';w.rel='noopener';g.appendChild(c);g.appendChild(w);box.appendChild(g)}
function leadCard(l,mode){var c=mk('div','card ld');c.appendChild(mk('b','t',l.title));
  c.appendChild(mk('div','m',[l.qty,l.city,l.cat].filter(Boolean).join(' · ')||'—'));if(l.details)c.appendChild(mk('div','d',l.details));
  var tg=mk('div','');tg.appendChild(mk('span','tag',ago(l.at)));if(l.until)tg.appendChild(mk('span','tag',left(l.until)));
  if(mode==='browse'){tg.appendChild(mk('span','tag g',l.cost?l.cost+' क्रेडिट':'🆓 मुफ़्त'));tg.appendChild(mk('span','tag',l.left+' जगह बाकी'))}c.appendChild(tg);
  var box=mk('div','');c.appendChild(box);
  if(mode==='browse'){if(l.own){box.appendChild(mk('div','k','यह आपकी अपनी ज़रूरत है'))}else{var b=mk('button','p',l.opened?'📞 नंबर देखें':'🔓 लीड खोलें'+(l.cost?' ('+l.cost+' क्रेडिट)':' (मुफ़्त)'));b.type='button';
    b.onclick=async function(){b.disabled=true;var r=await sb.rpc('studio_lead_unlock',{p_id:l.id});b.disabled=false;var d=r.data||{};
      if(d.r==='ok'){b.remove();contact(box,l,d.name,d.mobile);credits()}else{var m={full:'यह लीड अब भर चुकी है।',closed:'यह लीड बंद हो गई।',credits:'क्रेडिट कम हैं ('+(d.have||0)+' हैं, '+(d.need||'')+' चाहिए)।',own:'यह आपकी अपनी ज़रूरत है।',auth:'फिर से लॉगिन करें।'}[d.r]||'अभी नहीं खुल पाया। दोबारा कोशिश करें।';box.appendChild(mk('div','e',m))}};box.appendChild(b)}}
  if(mode==='opened')contact(box,l,l.name,l.mobile);
  return c}
async function browse(){var L=$('l-browse');L.textContent='';L.appendChild(mk('div','k','लोड हो रहा है…'));
  var r=await sb.rpc('studio_lead_list',{p_city:$('f-city').value.trim(),p_cat:$('f-cat').value.trim(),p_limit:60});L.textContent='';var rows=(r&&r.data)||[];
  if(!rows.length){var e=mk('div','card');e.appendChild(mk('div','k','अभी कोई लीड नहीं मिली। खोज बदलकर देखें, या अपनी ज़रूरत डालें।'));L.appendChild(e);return}
  rows.forEach(function(l){L.appendChild(leadCard(l,'browse'))})}
async function mine(){var L=$('l-mine');L.textContent='';var r=await sb.rpc('studio_lead_mine');var rows=(r&&r.data)||[];
  if(!rows.length){var e=mk('div','card');e.appendChild(mk('div','k','आपने अभी कोई ज़रूरत नहीं डाली।'));L.appendChild(e);return}
  rows.forEach(function(l){var c=mk('div','card ld');c.appendChild(mk('b','t',l.title));c.appendChild(mk('div','m',[l.qty,l.city].filter(Boolean).join(' · ')||'—'));
    var tg=mk('div','');var st={live:['चालू','tag g'],pending:['मंज़ूरी का इंतज़ार','tag'],closed:['बंद','tag r'],rejected:['नामंज़ूर','tag r']}[l.status]||[l.status,'tag'];tg.appendChild(mk('span',st[1],st[0]));
    tg.appendChild(mk('span','tag','👀 '+l.opened+' ने खोली'));if(l.status==='live')tg.appendChild(mk('span','tag',left(l.until)));c.appendChild(tg);
    if(l.status==='live'||l.status==='pending'){var b=mk('button','p','✖ बंद करें');b.type='button';b.style.cssText='background:#fff;color:#d4141c;border:1.5px solid #d4141c;margin-top:10px';b.onclick=async function(){b.disabled=true;await sb.rpc('studio_lead_close',{p_id:l.id});mine()};c.appendChild(b)}
    L.appendChild(c)})}
async function opened(){var L=$('l-opened');L.textContent='';var r=await sb.rpc('studio_lead_opened');var rows=(r&&r.data)||[];
  if(!rows.length){var e=mk('div','card');e.appendChild(mk('div','k','आपने अभी कोई लीड नहीं खोली। "लीड देखें" में जाइए।'));L.appendChild(e);return}
  rows.forEach(function(l){L.appendChild(leadCard(l,'opened'))})}
async function credits(){try{var r=await sb.rpc('studio_lead_credits');var d=r&&r.data;if(d)$('fr').textContent=d.free?'🆓 अभी लीड खोलना मुफ़्त है।':'💳 आपके क्रेडिट: '+d.balance}catch(e){}}
function tab(t){['browse','post','mine','opened'].forEach(function(x){$('p-'+x).hidden=x!==t});document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
  if(t==='browse')browse();if(t==='mine')mine();if(t==='opened')opened();window.scrollTo(0,0)}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){tab(b.getAttribute('data-t'))}});
$('f-go').onclick=browse;
CATS.forEach(function(c){var b=mk('button','',c);b.type='button';b.setAttribute('data-c',c);b.onclick=function(){CAT=CAT===c?'':c;document.querySelectorAll('#a-chips button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-c')===CAT)})};$('a-chips').appendChild(b)});
$('a-go').onclick=async function(){var e=$('a-err'),o=$('a-ok');e.textContent='';o.textContent='';var t=$('a-title').value.trim(),m=$('a-mob').value.replace(/\D/g,'').slice(-10);
  if(t.length<3){e.textContent='ज़रूरत लिखें (कम से कम 3 अक्षर)';return}if(m.length!==10){e.textContent='10 अंक का सही मोबाइल नंबर डालें';return}
  var b=$('a-go');b.disabled=true;var r=await sb.rpc('studio_lead_post',{p_title:t,p_details:$('a-det').value,p_qty:$('a-qty').value,p_city:$('a-city').value,p_cat:CAT,p_name:$('a-name').value,p_mobile:m,p_days:parseInt($('a-days').value,10)});b.disabled=false;
  if(r.data==='ok'){o.textContent='✓ आपकी ज़रूरत भेज दी गई।';['a-title','a-qty','a-det'].forEach(function(i){$(i).value=''});setTimeout(function(){tab('mine')},900)}
  else e.textContent=r.data==='off'?'यह सुविधा अभी चालू नहीं है।':r.data==='limit'?'आज की सीमा पूरी हो गई। कल फिर कोशिश करें।':r.data==='auth'?'फिर से लॉगिन करें।':r.data==='bad'?'जानकारी जाँचें।':'अभी नहीं जा पाया। दोबारा कोशिश करें।'};
(async function(){
  try{sb=window.supabase.createClient('https://rxhanrtoaplwphmwpgqg.supabase.co','sb_publishable_C76zU42qscFbBnfOcn5Zew_1VcRcL4d',{auth:{storageKey:'spywell-studio-auth'}});var s=await sb.auth.getSession();ME=s.data&&s.data.session&&s.data.session.user}catch(e){}
  if(!ME){$('gate').hidden=false;return}
  try{var ok=await sb.rpc('studio_lead_ok_me');if(!(ok&&ok.data===true)){$('gate').hidden=false;$('gate').firstChild.textContent='🎯 Buy Leads जल्द आ रहा है';$('gate').children[1].textContent='यह सुविधा अभी सबके लिए चालू नहीं हुई है।';var ga=$('gate').querySelector('a');if(ga)ga.textContent='← होम पर वापस';return}}catch(e){}
  $('app').hidden=false;credits();
  try{var p=await sb.from('studio_profiles').select('full_name,phone,card_json').eq('id',ME.id).maybeSingle(),pd=p.data||{},cj=pd.card_json||{};$('a-name').value=cj.name||pd.full_name||'';$('a-mob').value=String(cj.mobile||pd.phone||'').replace(/\D/g,'').slice(-10);$('a-city').value=cj.city||''}catch(e){}
  browse()})();
})();
</script></body></html>
