<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My saved locations | DynaMe</title>
<link rel="icon" href="/studio/vicard-icon.png">
<style>
:root{--wine:#12307f;--org:#f59a1a;--ink:#14203d;--bg:#eef3ff;--line:#d5def5;--mut:#5a6a8c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Hind,Poppins,system-ui,sans-serif;padding-bottom:30px}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#06133f,#12307f);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:6px 12px}
.wrap{max-width:520px;margin:auto;padding:16px}h1{font-size:21px;color:var(--wine);margin:6px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:var(--wine);color:#fff;font:600 16px inherit;cursor:pointer}button.alt{background:#fff;color:var(--wine);border:1.5px solid var(--wine)}button.wa{background:#1fa855}button:disabled{opacity:.6}
.k{font-size:13px;color:var(--mut);margin-top:6px}.e{color:#b00020;font-size:14px;margin-top:6px}.ok{color:#0a7a3b;font-size:14px;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pv{width:100%;display:block;margin:6px auto;border:1px solid var(--line);border-radius:12px;background:#fff}
[hidden]{display:none!important}
body.vw .top,body.vw h1,body.vw .wrap>.k,body.vw .wrap>.card:not(#outc){display:none}
.shr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.shr button,.shr a{margin:0;background:#0b0b0b;color:#fff;border-radius:12px;padding:13px 6px;text-align:center;text-decoration:none;font:600 15px inherit;border:0}
.wn{display:flex;gap:8px;margin-top:10px}.wn input{flex:1}.wn button{width:auto;margin:0;background:#1fa855;padding:0 14px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{width:auto;margin:0;padding:8px 12px;font-size:14px;background:#fff;color:var(--wine);border:1.5px solid var(--line);border-radius:20px}.chips button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
details>summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}details>summary::-webkit-details-marker{display:none}details>summary::after{content:'▼';color:var(--wine);font-size:13px}details[open]>summary::after{content:'▲'}
.pl{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}.pl b{font-size:17px}.pl .ac{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.pl .ac button,.pl .ac a{margin:0;padding:7px 2px;font:600 12.5px inherit;border-radius:10px;text-align:center;text-decoration:none}
.pl .ac .w{background:#1fa855;color:#fff;grid-column:1/4;font-size:15px;padding:10px}.pl{padding:9px 11px!important;margin-top:7px!important}.pl .k{margin-top:2px}#sv{padding:12px;margin:10px 0}.pl .ac .g{background:#fff;color:var(--wine);border:1.5px solid var(--wine)}.pl .ac .d{background:#fff;color:#b00020;border:1.5px solid #e6b3bb}</style>
<script>window.I18N_PICKER=false</script><script src="/studio/i18n-data.js"></script><script src="/studio/i18n-extra.js"></script><script src="/studio/i18n.js"></script><script src="/studio/appback.js"></script></head><body>
<div class="top"><b><img src="/studio/vicard-icon.png" alt="" width="30" height="30" style="border-radius:8px;vertical-align:middle;margin-right:8px">📍 My saved locations</b><a href="/studio/">← होम</a></div>
<div class="wrap"><h1>अपनी हर जगह की लोकेशन सेव रखें</h1>
<div class="k">दुकान, ऑफ़िस, फ़ैक्टरी, साइट, घर: एक बार सेव करें, फिर कहीं से भी एक टैप में WhatsApp पर भेजें। जितनी चाहें उतनी जगह जोड़ें।</div>
<div id="list"></div>
<button type="button" id="f-open">➕ नई जगह जोड़ें</button>
<div class="card" id="form" hidden>
<b id="f-title">➕ नई जगह जोड़ें</b>
<label>यह कौन-सी जगह है?</label><div class="chips" id="f-chips"></div>
<input id="f-label" maxlength="40" placeholder="अपना नाम लिखें, जैसे: नई साइट, गोदाम 2" style="margin-top:8px" hidden>
<label>जगह / दुकान का नाम (खाली छोड़ सकते हैं)</label><input id="f-name" maxlength="60" placeholder="जैसे: शर्मा इलेक्ट्रॉनिक्स">
<label>पता (खाली छोड़ सकते हैं)</label><textarea id="f-addr" rows="2" maxlength="200" placeholder="गली, मोहल्ला, शहर"></textarea>
<label>मोबाइल नंबर (खाली छोड़ सकते हैं)</label><input id="f-mob" inputmode="numeric" maxlength="12" placeholder="9876543210">
<label>गूगल मैप लोकेशन</label><input id="f-map" inputmode="url" maxlength="300" placeholder="मैप लिंक चिपकाएँ या नीचे बटन दबाएँ">
<button type="button" class="alt" id="f-loc">📍 मैं अभी इसी जगह पर हूँ, लोकेशन जोड़ें</button>
<div class="k">घर बैठे जोड़ना हो तो Google Maps में जगह खोलें → Share → लिंक कॉपी करें और ऊपर चिपका दें।</div>
<div class="e" id="f-err"></div>
<button type="button" id="f-save">💾 जगह सेव करें</button>
<button type="button" class="alt" id="f-cancel">रद्द करें</button>
<div class="ok" id="f-ok"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},P=[],sb=null,u=null,pcj={},PROMO='https://spywell.in/studio/',EDIT=null,LAB='दुकान';
var LABS=[['🏠','घर'],['🏪','दुकान'],['🏢','ऑफ़िस'],['🏭','फ़ैक्टरी'],['🚧','साइट'],['📦','गोदाम'],['✏️','अन्य']];
function ic(l){for(var i=0;i<LABS.length-1;i++)if(LABS[i][1]===l)return LABS[i][0];return '📍'}
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function mapUrl(m){m=String(m||'').trim();if(!m)return '';if(!/^https?:/i.test(m))m='https://'+m;try{var q=new URL(m);return q.hostname.indexOf('.')>0?q.href:''}catch(e){return ''}}
function text(p){var t=ic(p.label)+' '+p.label+(p.name?' · '+p.name:'')+'\n';if(p.addr)t+='पता: '+p.addr+'\n';if(p.mob)t+='मोबाइल: +91 '+p.mob+'\n';if(p.map)t+='📍 लोकेशन (दबाते ही रास्ता खुलेगा): '+p.map+'\n';
  t+='\n📲 अपना डिजिटल कार्ड और लोकेशन कार्ड मुफ़्त बनाएँ: '+PROMO;return t}
function go(url){location.href=url}
function chips(){var c=$('f-chips');c.textContent='';var custom=!LABS.slice(0,-1).some(function(l){return l[1]===LAB});
  LABS.forEach(function(l){var on=l[1]==='अन्य'?custom:l[1]===LAB;var b=mk('button',on?'on':'',l[0]+' '+l[1]);b.type='button';b.onclick=function(){if(l[1]==='अन्य'){LAB=$('f-label').value.trim()||'';$('f-label').hidden=false;chips();$('f-label').focus()}else{LAB=l[1];$('f-label').hidden=true;chips()}};c.appendChild(b)});
  $('f-label').hidden=!custom}
$('f-label').oninput=function(){LAB=this.value.trim()};
function store(){try{localStorage.setItem('vc_places',JSON.stringify(P))}catch(e){}
  if(!sb||!u)return Promise.resolve('local');var cj=Object.assign({},pcj,{places:P});pcj=cj;
  return sb.from('studio_profiles').update({card_json:cj}).eq('id',u.id).then(function(r){return r&&r.error?'err':'ok'},function(){return 'err'})}
function reset(){EDIT=null;LAB='दुकान';['label','name','addr','mob','map'].forEach(function(k){$('f-'+k).value=''});$('f-title').textContent='➕ नई जगह जोड़ें';$('f-err').textContent='';chips();$('form').hidden=true;$('f-open').hidden=false}
$('f-open').onclick=function(){$('form').hidden=false;$('f-open').hidden=true;$('form').scrollIntoView({behavior:'smooth'})};
function draw(){var L=$('list');L.textContent='';
  if(!P.length){L.appendChild(mk('div','k','अभी कोई जगह सेव नहीं है। नीचे से पहली जगह जोड़ें।')).style.marginTop='12px';return}
  P.forEach(function(p){var d=mk('details','pl');d.appendChild(mk('summary','',ic(p.label)+' '+p.label+(p.name?' · '+p.name:'')));
    if(p.addr)d.appendChild(mk('div','k',p.addr));if(p.mob)d.appendChild(mk('div','k','📞 +91 '+p.mob));
    if(!p.map)d.appendChild(mk('div','e','मैप लोकेशन नहीं जुड़ी है, "बदलें" दबाकर जोड़ें।'));
    var ac=mk('div','ac');
    var w=mk('button','w','💬 WhatsApp पर लोकेशन भेजें');w.type='button';w.onclick=function(){go('https://wa.me/?text='+encodeURIComponent(text(p)))};ac.appendChild(w);
    var NV=window.ViNative;
    var sh=mk('button','g','📤 शेयर');sh.type='button';sh.onclick=function(){var t=text(p);if(NV&&NV.shareText){NV.shareText(t);return}if(navigator.share){navigator.share({text:t}).catch(function(){});return}cp.click()};ac.appendChild(sh);
    var cp=mk('button','g','📋 कॉपी');cp.type='button';cp.onclick=function(){var t=text(p);function ok(){cp.textContent='कॉपी हुआ ✓';setTimeout(function(){cp.textContent='📋 कॉपी'},2000)}
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){});};ac.appendChild(cp);
    if(p.map){var m=mk('a','g','📍 मैप');m.href=p.map;m.target='_blank';m.rel='noopener';ac.appendChild(m)}
    var ed=mk('button','g','✏️ बदलें');ed.type='button';ed.onclick=function(){EDIT=p.id;LAB=p.label;$('f-label').value=LABS.slice(0,-1).some(function(l){return l[1]===p.label})?'':p.label;$('f-name').value=p.name||'';$('f-addr').value=p.addr||'';$('f-mob').value=p.mob||'';$('f-map').value=p.map||'';$('f-title').textContent='✏️ जगह बदलें';$('form').hidden=false;$('f-open').hidden=true;chips();$('form').scrollIntoView({behavior:'smooth'})};ac.appendChild(ed);
    var dl=mk('button','d','🗑 हटाएँ');dl.type='button';var arm=false;dl.onclick=function(){if(!arm){arm=true;dl.textContent='पक्का हटाएँ?';setTimeout(function(){arm=false;dl.textContent='🗑 हटाएँ'},3000);return}P=P.filter(function(q){return q.id!==p.id});store();if(EDIT===p.id)reset();draw()};ac.appendChild(dl);
    d.appendChild(ac);L.appendChild(d)})}
$('f-cancel').onclick=reset;
$('f-loc').onclick=function(){var e=$('f-err'),b=$('f-loc'),old=b.textContent;e.textContent='';if(!navigator.geolocation){e.textContent='इस फ़ोन में लोकेशन उपलब्ध नहीं है';return}
  b.disabled=true;b.textContent='लोकेशन ली जा रही है…';
  navigator.geolocation.getCurrentPosition(function(p){b.disabled=false;b.textContent=old;$('f-map').value='https://www.google.com/maps?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6)},
    function(){b.disabled=false;b.textContent=old;e.textContent='लोकेशन नहीं मिली। फ़ोन की लोकेशन चालू करके दोबारा कोशिश करें।'},{enableHighAccuracy:true,timeout:15000})};
$('f-save').onclick=function(){var e=$('f-err'),ok=$('f-ok');e.textContent='';ok.textContent='';
  var lab=(LAB||'').trim().slice(0,40),mp=$('f-map').value.trim(),mu=mapUrl(mp),mb=$('f-mob').value.replace(/\D/g,'').slice(-10),ad=$('f-addr').value.trim();
  if(!lab){e.textContent='जगह का नाम (लेबल) चुनें या लिखें';return}
  if(mp&&!mu){e.textContent='मैप लिंक सही नहीं है';return}
  if(!mu&&!ad){e.textContent='मैप लोकेशन या पता, दोनों में से कम से कम एक भरें';return}
  if($('f-mob').value.trim()&&mb.length!==10){e.textContent='10 अंक का सही मोबाइल नंबर डालें';return}
  var rec={id:EDIT||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),label:lab,name:$('f-name').value.trim().slice(0,60),addr:ad.slice(0,200),mob:mb,map:mu};
  if(EDIT)P=P.map(function(q){return q.id===EDIT?rec:q});else P.push(rec);
  var b=$('f-save');b.disabled=true;
  store().then(function(r){b.disabled=false;if(r==='err'){e.textContent='खाते में सेव नहीं हो पाया (इस फ़ोन में सेव है)। इंटरनेट जाँचकर दोबारा सेव करें।'}else ok.textContent=r==='ok'?'✓ जगह सेव हो गई':'✓ इस फ़ोन में सेव हो गई (लॉगिन करने पर खाते में भी रहेगी)';reset();draw();window.scrollTo(0,0)})};
(async function(){
  try{P=JSON.parse(localStorage.getItem('vc_places')||'[]');if(!Array.isArray(P))P=[]}catch(e){P=[]}
  chips();draw();
  try{if(window.supabase){sb=window.supabase.createClient('https://rxhanrtoaplwphmwpgqg.supabase.co','sb_publishable_C76zU42qscFbBnfOcn5Zew_1VcRcL4d',{auth:{storageKey:'spywell-studio-auth'}});
    var s=await sb.auth.getSession();u=s.data&&s.data.session&&s.data.session.user;
    if(u){var p=await sb.from('studio_profiles').select('card_json').eq('id',u.id).maybeSingle();pcj=(p.data&&p.data.card_json)||{};
      var srv=Array.isArray(pcj.places)?pcj.places:[],ids={};srv.forEach(function(q){ids[q.id]=1});
      var extra=P.filter(function(q){return q&&q.id&&!ids[q.id]});P=srv.concat(extra);if(extra.length)store();else try{localStorage.setItem('vc_places',JSON.stringify(P))}catch(e){}
      draw();
      try{var r=await sb.rpc('studio_ref_me');if(r&&r.data&&r.data.enabled&&r.data.code)PROMO='https://spywell.in/studio/?ref='+r.data.code}catch(e){}}}}catch(e){}
})();
})();
</script></body></html>
