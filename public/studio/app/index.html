function loginView(err){$('top').hidden=true;$('nav').hidden=true;
  main.style.padding='0';main.style.maxWidth='none';
  main.innerHTML='<div class="login"><img src="/studio/vicard-icon.png" alt="" style="width:76px;height:76px;border-radius:22px;background:#fff"><h1 style="font-size:38px;margin-top:16px">LiveCard</h1><p style="opacity:.92;margin:4px 0 24px">डिजिटल विज़िटिंग कार्ड, मिनी वेबसाइट, इनविटेशन और नेटवर्क — एक ऐप में।</p>'+
  '<button class="btn sun" id="g">🔐 Google से लॉगिन</button><div style="text-align:center;margin:16px 0;opacity:.85">या ईमेल पर कोड (OTP) से</div>'+
  '<form id="ef"><label for="em">ईमेल</label><input id="em" type="email" required autocomplete="email"><div id="otpw" hidden><label for="ot">ईमेल पर आया कोड</label><input id="ot" inputmode="numeric" maxlength="8" autocomplete="one-time-code"></div><button class="btn alt" style="color:#fff;border-color:#fff" id="eb">कोड भेजें</button></form>'+
  '<div class="err" id="le">'+esc(err||'')+'</div><a href="/studio/?app=1&classic=1" style="display:block;text-align:center;color:#fff;opacity:.85;margin-top:10px;font-size:14px">मोबाइल नंबर / पासवर्ड से लॉगिन</a><p class="sm" style="opacity:.6;text-align:center;margin-top:24px">LiveCard '+VER+' · SpyWell InfoTech</p></div>';
  on('g',async function(){$('le').textContent='';var HERE=location.origin+'/studio/appauth/';
    if(window.ViNative&&ViNative.openAuth){try{var ra=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:HERE,skipBrowserRedirect:true}});if(ra.data&&ra.data.url){ViNative.openAuth(ra.data.url);$('le').textContent='Google में लॉगिन करके "LiveCard ऐप में खोलें" दबाएँ।';return}}catch(e){}}
    try{sessionStorage.setItem('lc_to_app','1')}catch(e){}var r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/studio/app/'}});if(r.error)$('le').textContent='Google लॉगिन अभी नहीं चला। ईमेल कोड से कोशिश करें।'});
  var sent=false;$('ef').onsubmit=async function(e){e.preventDefault();var em=$('em').value.trim(),b=$('eb');$('le').textContent='';b.disabled=true;
    if(!sent){var r=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});b.disabled=false;if(r.error){$('le').textContent='कोड नहीं भेजा जा सका। थोड़ी देर बाद कोशिश करें।';return}sent=true;$('otpw').hidden=false;b.textContent='लॉगिन करें';$('ot').focus();return}
    var v=await sb.auth.verifyOtp({email:em,token:$('ot').value.trim(),type:'email'});b.disabled=false;if(v.error){$('le').textContent='कोड सही नहीं है।';return}}}

async function start(session){if(!session){ME=null;loginView();return}
  if(ME&&ME.id===session.user.id)return;ME=session.user;main.style.padding='';main.style.maxWidth='';main.innerHTML='<div class="load">लोड हो रहा है…</div>';
  try{await loadCore()}catch(e){}
  if(/access_token|refresh_token/.test(location.hash)){try{history.replaceState(null,'',location.pathname+'#home')}catch(e){}}
  route()}
sb.auth.onAuthStateChange(function(ev,s){if(ev==='SIGNED_OUT'){ME=null;loginView();return}if(s&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'||ev==='TOKEN_REFRESHED'))start(s)});
(async function(){var h=location.hash.replace(/^#/,''),q=new URLSearchParams(location.search),err='';
  try{var hp=new URLSearchParams(h);
    if(hp.get('access_token')&&hp.get('refresh_token')){var r1=await sb.auth.setSession({access_token:hp.get('access_token'),refresh_token:hp.get('refresh_token')});if(r1.error)err='लॉगिन पूरा नहीं हुआ: '+r1.error.message}
    else if(q.get('code')){var r2=await sb.auth.exchangeCodeForSession(q.get('code'));if(r2.error)err='लॉगिन पूरा नहीं हुआ: '+r2.error.message}
    else if(hp.get('error_description')||q.get('error_description'))err='Google लॉगिन रद्द/फ़ेल: '+(hp.get('error_description')||q.get('error_description'))}catch(e){err='लॉगिन पूरा नहीं हुआ।'}
  if(/access_token|refresh_token|error_description/.test(h)||q.get('code')){try{history.replaceState(null,'',location.pathname+'#home')}catch(e){}}
  var r=await sb.auth.getSession();var s=r.data&&r.data.session;if(!s&&err){ME=null;loginView(err);return}start(s)})().catch(function(){loginView()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ME){loadCore().then(function(){var p=parts().name;if(p==='home'||p==='profile')route()}).catch(function(){})}});
})();
