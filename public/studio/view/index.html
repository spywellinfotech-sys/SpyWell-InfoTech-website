<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpyWell Live Studio</title><link rel="icon" href="/favicon.png">
<style>body{margin:0;background:#f3ead6;font:16px/1.5 Hind,Poppins,system-ui,sans-serif;color:#2b1a14}
#sheet{max-width:440px;margin:0 auto;background:#fff;min-height:100vh}
.msg{padding:60px 24px;text-align:center;opacity:0;animation:mshow .2s .8s forwards}@keyframes mshow{to{opacity:1}}.msg b{display:block;font-size:20px;margin-bottom:8px}
.foot{max-width:440px;margin:0 auto;text-align:center;font-size:12px;padding:12px;color:#7a6248}.foot a{color:#8b1a2b}</style><script>window.I18N_PICKER=false</script><script src="/studio/i18n-data.js"></script><script src="/studio/i18n-extra.js"></script><script src="/studio/i18n.js"></script></head><body>
<div id="sheet"><div class="msg">लोड हो रहा है…</div></div>
<div class="foot" id="foot" hidden><img src="/logo.png" alt="SpyWell" width="18" height="18" style="vertical-align:middle;margin-right:4px">SpyWell Live Studio से बनाया गया · <a href="/studio/">अपना कार्ड बनाएँ</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/studio/qr.js"></script>
<script src="/studio/render.js"></script>
<script>
(function(){
var B='https://rxhanrtoaplwphmwpgqg.supabase.co',K='sb_publishable_C76zU42qscFbBnfOcn5Zew_1VcRcL4d';
var q=new URLSearchParams(location.search),t=q.get('t')==='i'?'invitation':(q.get('t')==='v'||q.get('t')==='w')?'visiting':'',asWeb=q.get('t')==='w',s=(q.get('s')||'').toLowerCase();
var box=document.getElementById('sheet');
function msg(a,b){box.textContent='';var d=document.createElement('div');d.className='msg';var x=document.createElement('b');x.textContent=a;d.appendChild(x);d.appendChild(document.createTextNode(b||''));box.appendChild(d)}
if(!t||!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(s)||s.length<3||s.length>60){msg('यह लिंक सही नहीं है','कृपया भेजने वाले से पूरा लिंक दोबारा माँगें।');return}
if(!window.supabase||!window.StudioRender){msg('पेज लोड नहीं हो पाया','इंटरनेट जाँचकर दोबारा खोलें।');return}
var sb=window.supabase.createClient(B,K,{auth:{persistSession:false,autoRefreshToken:false}});
(async function(){
  var r=await sb.from('studio_designs').select('user_id,template_id,product_type,title,content_json').eq('slug',s).eq('status','published').eq('product_type',t).maybeSingle();
  if(r.error){msg('अभी कार्ड नहीं खुल पाया','थोड़ी देर बाद दोबारा कोशिश करें।');return}
  if(!r.data){msg('यह कार्ड उपलब्ध नहीं है','हो सकता है यह हटा दिया गया हो या अभी प्रकाशित न हो।');return}
  var tp=await sb.from('studio_templates').select('config').eq('id',r.data.template_id).maybeSingle();
  box.textContent='';
  var vid='';try{vid=localStorage.getItem('sv_vid')||'';if(!vid){vid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/-/g,'').slice(0,32);localStorage.setItem('sv_vid',vid)}}catch(e){vid=''}
  function track(kind){try{var dev=/Mobi|Android|iPhone/i.test(navigator.userAgent)?'mobile':'desktop',src='';
    try{var ref=document.referrer?new URL(document.referrer).hostname.replace(/^www\./,''):'';src=new URLSearchParams(location.search).get('src')||ref||'direct'}catch(e){src='direct'}
    sb.rpc('studio_track',{p_slug:s,p_type:t,p_kind:kind,p_visitor:vid,p_device:dev,p_src:src}).then(function(){},function(){})}catch(e){}}
  var cj=r.data.content_json||{},sty=(cj.style&&typeof cj.style==='object')?cj.style:{},isSite=asWeb&&sty.site===true;
  if(asWeb&&!isSite){msg('यह मिनी वेबसाइट अभी चालू नहीं है','कार्ड का मालिक एडिटर में "मिनी वेबसाइट मोड" चालू करे। तब तक सीधा कार्ड देखें: /v/'+s);return}
  if(sty.gate===true){
    try{window.I18N&&window.I18N.setLang(sty.lang||'hi',true)}catch(e){}
    var gk='sv_lead_'+t+s,got='';try{got=localStorage.getItem(gk)||''}catch(e){}
    if(!got){
      await new Promise(function(done){
        box.textContent='';var gd=document.createElement('div');gd.style.cssText='max-width:380px;margin:40px auto;padding:22px 18px;background:#fff;border:1px solid #e8d5ad;border-radius:16px;text-align:center';
        function ge(tag,txt,css){var e=document.createElement(tag);if(txt)e.textContent=txt;if(css)e.style.cssText=css;return e}
        gd.appendChild(ge('div','🔒','font-size:36px'));gd.appendChild(ge('b','कार्ड देखने के लिए अपनी जानकारी दीजिए','display:block;font-size:18px;color:#8b1a2b;margin:6px 0 12px'));
        var ni=document.createElement('input');ni.type='text';ni.maxLength=60;ni.placeholder='आपका नाम';ni.autocomplete='name';
        var mi=document.createElement('input');mi.type='tel';mi.inputMode='numeric';mi.maxLength=14;mi.placeholder='मोबाइल नंबर (10 अंक)';mi.autocomplete='tel';
        [ni,mi].forEach(function(i){i.style.cssText='display:block;width:100%;margin:8px 0;padding:12px;border:1px solid #e8d5ad;border-radius:10px;font:inherit'});
        var ger=ge('div','','color:#b00020;font-size:14px;min-height:20px'),gb=ge('button','कार्ड देखें','width:100%;margin-top:6px;padding:13px;border:0;border-radius:10px;background:#8b1a2b;color:#fff;font:700 16px inherit;cursor:pointer');
        gd.appendChild(ni);gd.appendChild(mi);gd.appendChild(ger);gd.appendChild(gb);
        gd.appendChild(ge('div','आपका नाम और नंबर सिर्फ़ इस कार्ड को भेजने वाले को दिखेगा।','font-size:12px;color:#7a6248;margin-top:10px'));
        box.appendChild(gd);
        async function go(){var nm=ni.value.trim(),mb=mi.value.replace(/\D/g,'').slice(-10);
          if(!nm){ger.textContent='अपना नाम लिखें';return}if(!/^[6-9][0-9]{9}$/.test(mb)){ger.textContent='सही 10 अंक का मोबाइल नंबर डालें';return}
          gb.disabled=true;ger.textContent='';
          var vv='';try{vv=localStorage.getItem('sv_vid')||''}catch(e){}
          var src='';try{var rf=document.referrer?new URL(document.referrer).hostname.replace(/^www\./,''):'';src=new URLSearchParams(location.search).get('src')||rf||'direct'}catch(e){src='direct'}
          var lr=await sb.rpc('studio_lead_add',{p_slug:s,p_type:t,p_name:nm,p_mobile:mb,p_visitor:vv,p_device:/Mobi|Android|iPhone/i.test(navigator.userAgent)?'mobile':'desktop',p_src:src});
          if(lr.error||lr.data!==true){gb.disabled=false;ger.textContent='अभी सेव नहीं हो पाया। दोबारा कोशिश करें।';return}
          try{localStorage.setItem(gk,'1')}catch(e){}box.textContent='';done()}
        gb.onclick=go;mi.onkeydown=function(e){if(e.key==='Enter')go()}})}
  }
  if(isSite){box.style.maxWidth='none';box.style.background='transparent'}
  var tabs=document.createElement('div');tabs.id='sets';tabs.style.cssText='max-width:'+(isSite?'820px':'440px')+';margin:0 auto;display:none;gap:6px;overflow-x:auto;padding:8px;background:#f3ead6;position:sticky;top:0;z-index:9';
  box.parentNode.insertBefore(tabs,box);
  if(isSite)window.StudioRender.site(box,(tp.data&&tp.data.config)||{},cj,{onAct:track});
  else window.StudioRender.render(box,t,(tp.data&&tp.data.config)||{},cj,{onAct:track});
  if(typeof sty.set==='string'&&/^[a-z0-9]{8,32}$/.test(sty.set)){
    var sr=await sb.from('studio_designs').select('slug,title,lbl:content_json->style->>setLabel,ord:created_at').eq('status','published').eq('product_type',t).eq('user_id',r.data.user_id).eq('content_json->style->>set',sty.set).order('created_at').limit(12);
    if(!sr.error&&sr.data&&sr.data.length>1){tabs.style.display='flex';sr.data.forEach(function(x,i){var a=document.createElement('a');a.textContent=String(x.lbl||x.title||('कार्ड '+(i+1))).slice(0,24);var cur=x.slug===s;a.href=cur?'#':'/'+(t==='invitation'?'inv':'v')+'/'+x.slug;a.style.cssText='flex:none;padding:7px 14px;border-radius:20px;text-decoration:none;font-size:14px;font-weight:600;border:1px solid #8b1a2b;'+(cur?'background:#8b1a2b;color:#fff':'color:#8b1a2b;background:#fff');tabs.appendChild(a)})}}
  document.title=window.StudioRender.title(t,cj)+' | SpyWell Live Studio';
  try{window.I18N&&window.I18N.setLang(sty.lang||'hi',true)}catch(e){}
  document.getElementById('foot').hidden=false;
  try{(function(){var ab=window.supabase.createClient(B,K,{auth:{storageKey:'spywell-studio-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    var f=document.getElementById('foot'),bt=document.createElement('button');bt.type='button';bt.textContent='💾 यह कार्ड मेरे पास सेव करें';
    bt.style.cssText='display:block;margin:0 auto 10px;padding:10px 18px;border:0;border-radius:22px;background:#8b1a2b;color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer';
    var note=document.createElement('div');note.style.cssText='margin-bottom:8px;font-size:13px';
    f.insertBefore(note,f.firstChild);f.insertBefore(bt,f.firstChild);
    bt.onclick=async function(){bt.disabled=true;var ss=await ab.auth.getSession();
      if(!ss.data||!ss.data.session){try{localStorage.setItem('sp_pending_save',t+'|'+s)}catch(e){}location.href='/studio/';return}
      var r2=await ab.rpc('studio_save_card',{p_type:t,p_slug:s});bt.disabled=false;
      var m={ok:'सेव हो गया ✓ (Studio में "सेव किए कार्ड" में देखें)',own:'यह आपका अपना कार्ड है।',missing:'कार्ड नहीं मिला।',limit:'सेव की सीमा पूरी हो गई।',login:'पहले लॉगिन करें।'};
      note.textContent=r2.error?'सेव नहीं हो पाया। दोबारा कोशिश करें।':(m[r2.data]||'हो गया');if(!r2.error&&r2.data==='ok')bt.textContent='✓ सेव हो गया'}})()}catch(e){}
  try{var tk='sv_'+t+s;if(!sessionStorage.getItem(tk)){sessionStorage.setItem(tk,'1');track('view')}}catch(e){}
})();
})();
</script></body></html>
