<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>गाड़ी पर लगाने वाला कॉल QR | LiveCard</title>
<link rel="icon" href="/dyname/logo.png">
<style>
:root{--wine:#8b1a2b;--ink:#2b1a14;--bg:#fdf6e8;--line:#e8d5ad;--mut:#7a6248}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Hind,Poppins,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:50;background:var(--wine);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;font-size:14px}
.wrap{max-width:520px;margin:auto;padding:16px}h1{font-size:21px;color:var(--wine);margin:6px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:600 16px inherit;cursor:pointer}
.k{font-size:13px;color:var(--mut);margin-top:6px}.e{color:#b00020;font-size:14px;margin-top:6px}
#pv{width:100%;max-width:300px;display:block;margin:12px auto;border:1px solid var(--line);border-radius:8px}
[hidden]{display:none!important}/*desk-v1*/@media(min-width:1000px){.wrap{max-width:900px}}</style><script>window.I18N_PICKER=false</script><script src="/studio/i18n-data.js?v=20261128a"></script><script src="/studio/i18n-extra.js?v=20261128c"></script><script src="/studio/i18n.js?v=20261128a"></script><script src="/studio/appback.js"></script></head><body>
<div class="top"><b><img src="/dyname/logo.png" alt="LiveCard" width="30" height="30" style="background:#fff;border-radius:50%;padding:2px;vertical-align:middle;margin-right:8px">🚗 कार कॉल QR</b><a href="/studio/">← Studio</a></div>
<div class="wrap"><h1>गाड़ी पर लगाने वाला कॉल QR</h1>
<div class="k">इसे स्कैन करने पर "कॉल करें" का बड़ा बटन खुलता है। बिल्कुल मुफ़्त। QR आपके प्रोफ़ाइल वाले मोबाइल नंबर से ही बनता है। ध्यान रहे, स्कैन करने वाले को आपका नंबर दिखेगा।</div>
<div class="card" id="gate" hidden></div>
<div class="card" id="main" hidden>
<div id="who" class="k" style="margin:4px 0 6px;font-weight:600"></div><label>QR पर कॉल का मोबाइल नंबर (आपकी प्रोफ़ाइल का, बदला नहीं जा सकता)</label><input id="m" type="tel" inputmode="numeric" maxlength="14" readonly style="background:#f1f3f9;color:#333">
<div id="cars" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px"></div>
<label>स्टिकर पर लिखा वाक्य</label><input id="t" type="text" maxlength="40" value="Contact Car Owner">
<label>आपका नाम (खाली छोड़ सकते हैं)</label><input id="n" type="text" maxlength="30">
<label>गाड़ी नंबर (खाली छोड़ सकते हैं)</label><input id="v" type="text" maxlength="14" placeholder="UP11 AB 1234">
<label>QR का प्रकार</label><select id="w"><option value="p">कॉल पेज QR (कॉल बटन + मुफ़्त QR बनाने का लिंक)</option><option value="c">सीधा कॉल QR (बिना इंटरनेट भी चले)</option><option value="cw">सीधा कॉल QR + WhatsApp QR (दो QR)</option></select>
<div class="e" id="err"></div><div class="k" id="sv" style="margin-top:8px;color:#0b6b3a;font-weight:600"></div>
<img id="pv" alt="" hidden style="width:100%;margin-top:12px;border-radius:10px;border:1px solid #e8d5ad">
<button type="button" id="dl">⬇️ QR स्टिकर डाउनलोड करें</button>
<div class="k">डाउनलोड न हो तो ऊपर की तस्वीर को देर तक दबाकर सेव करें, फिर प्रिंट करवाइए।</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/studio/qr.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},sc=document.createElement('canvas');
var q=new URLSearchParams(location.search);
function pageUrl(cm){var u='https://livecard.in/studio/call/?m='+cm,nn=$('n').value.trim().slice(0,30),vv=$('v').value.trim().toUpperCase().slice(0,14);if(nn)u+='&n='+encodeURIComponent(nn);if(vv)u+='&v='+encodeURIComponent(vv);return u}
function num(){return $('m').value.replace(/\D/g,'').slice(-10)}
function qr(text,px){var c=document.createElement('canvas');try{window.StudioQR.draw(c,text,px)}catch(e){}return c}
function draw(){var cm=num();$('err').textContent='';
  if(cm.length!==10){$('pv').hidden=true;if($('m').value)$('err').textContent='10 अंक का सही मोबाइल नंबर डालें';return}
  var W=800,H=1000,x=sc.getContext('2d'),two=$('w').value==='cw';sc.width=W;sc.height=H;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.strokeStyle='#8b1a2b';x.lineWidth=14;x.strokeRect(14,14,W-28,H-28);
  x.fillStyle='#8b1a2b';x.fillRect(14,14,W-28,150);x.fillStyle='#fff';x.textAlign='center';x.font='bold 70px sans-serif';x.fillText(two?'📞 CALL / WhatsApp':'📞 SCAN TO CALL',W/2,118,W-60);
  if(two){x.drawImage(qr('tel:+91'+cm,330),40,215,330,330);x.drawImage(qr('https://wa.me/91'+cm,330),430,215,330,330);
    x.fillStyle='#2b1a14';x.font='bold 36px sans-serif';x.fillText('📞 CALL',205,590);x.fillText('💬 WHATSAPP',595,590)}
  else x.drawImage(qr($('w').value==='p'?pageUrl(cm):'tel:+91'+cm,500),150,190,500,500);
  x.fillStyle='#2b1a14';x.font='bold 46px sans-serif';x.fillText(($('t').value||'').trim().slice(0,40),W/2,two?680:740,W-80);
  var nm=$('n').value.trim(),vn=$('v').value.trim().toUpperCase();
  x.font='38px sans-serif';if(nm)x.fillText(nm,W/2,two?750:820,W-80);
  x.font='bold 70px sans-serif';if(vn)x.fillText(vn,W/2,two?860:920,W-80);
  x.fillStyle='#8b1a2b';x.font='bold 30px sans-serif';x.fillText('अपना कार्ड बनाइए: www.livecard.in',W/2,962,W-80);
  try{$('pv').src=sc.toDataURL('image/png');$('pv').hidden=false}catch(e){$('pv').hidden=true}}
var svT=null,CARS=[],CI=0;
function curToCar(){CARS[CI]={t:$('t').value.trim().slice(0,40),n:$('n').value.trim().slice(0,30),v:$('v').value.trim().toUpperCase().slice(0,14),w:$('w').value}}
function loadCar(i){CI=i;var c=CARS[i]||{};$('t').value=c.t!=null?String(c.t).slice(0,40):'Contact Car Owner';$('n').value=c.n!=null?String(c.n).slice(0,30):'';$('v').value=c.v!=null?String(c.v).slice(0,14):'';$('w').value=/^(p|c|cw)$/.test(c.w||'')?c.w:'p';chips();draw()}
function chips(){var b=$('cars');b.textContent='';CARS.forEach(function(c,i){var e=document.createElement('button');e.type='button';e.textContent='🚗 '+(c.v||('गाड़ी '+(i+1)));e.style.cssText='width:auto;margin:0;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1.5px solid #8b1a2b;'+(i===CI?'background:#8b1a2b;color:#fff':'background:#fff;color:#8b1a2b');e.onclick=function(){curToCar();loadCar(i);save()};b.appendChild(e)});
  var a=document.createElement('button');a.type='button';a.textContent='➕ दूसरी गाड़ी';a.style.cssText='width:auto;margin:0;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1.5px dashed #8b1a2b;background:#fff;color:#8b1a2b';a.onclick=function(){curToCar();CARS.push({t:CARS[CI]&&CARS[CI].t||'Contact Car Owner',n:CARS[CI]&&CARS[CI].n||'',v:'',w:CARS[CI]&&CARS[CI].w||'p'});loadCar(CARS.length-1);save()};b.appendChild(a);
  if(CARS.length>1){var d=document.createElement('button');d.type='button';d.textContent='🗑 यह गाड़ी हटाएँ';d.style.cssText='width:auto;margin:0;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:700;border:1.5px solid #b00020;background:#fff;color:#b00020';d.onclick=function(){if(!confirm('इस गाड़ी का QR हटाएँ?'))return;CARS.splice(CI,1);loadCar(Math.max(0,CI-1));save()};b.appendChild(d)}}
function save(){clearTimeout(svT);svT=setTimeout(async function(){if(!window._SB||!window._UID)return;try{curToCar();var cur=await window._SB.from('studio_profiles').select('card_json').eq('id',window._UID).maybeSingle();var cj=Object.assign({},(cur.data&&cur.data.card_json)||{},{carqr:{m:num(),cars:CARS.slice(0,50),i:CI}});var r=await window._SB.from('studio_profiles').update({card_json:cj}).eq('id',window._UID);$('sv').textContent=r.error?'सेव नहीं हो पाया':'✓ प्रोफ़ाइल में सेव हो गया'}catch(e){}},900)}
window._initCars=function(sq){CARS=sq&&Array.isArray(sq.cars)&&sq.cars.length?sq.cars.slice(0,10):(sq&&(sq.t!=null||sq.v||sq.n)?[{t:sq.t,n:sq.n,v:sq.v,w:sq.w}]:[{t:'Contact Car Owner',n:'',v:'',w:'p'}]);var i=sq&&sq.i>=0&&sq.i<CARS.length?sq.i:0;loadCar(i)};
['m','t','n','v'].forEach(function(i){$(i).oninput=function(){curToCar();if(i==='v')chips();draw();save()}});$('w').onchange=function(){curToCar();draw();save()};
$('dl').onclick=function(){var cm=num();if(cm.length!==10){$('err').textContent='पहले 10 अंक का मोबाइल नंबर डालें';return}draw();save();
  sc.toBlob(function(b){if(!b)return;var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='car-call-qr-'+(($('v').value||'').replace(/[^A-Za-z0-9]/g,'')||cm)+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)},'image/png')};
function gate(msg,href,label){var g=$('gate');g.textContent='';var p=document.createElement('div');p.className='k';p.style.cssText='font-size:15px;margin-bottom:12px';p.textContent=msg;g.appendChild(p);
  if(href){var a=document.createElement('a');a.href=href;a.textContent=label;a.style.cssText='display:block;text-align:center;background:#12307f;color:#fff;border-radius:12px;padding:13px;text-decoration:none;font-weight:600';g.appendChild(a)}g.hidden=false;$('main').hidden=true}
(async function(){
  try{
    if(!window.supabase){gate('लोड नहीं हो पाया। इंटरनेट जाँचकर दोबारा खोलें।');return}
    var sb=window.supabase.createClient('https://rxhanrtoaplwphmwpgqg.supabase.co','sb_publishable_C76zU42qscFbBnfOcn5Zew_1VcRcL4d',{auth:{storageKey:'spywell-studio-auth'}});
    var s=await sb.auth.getSession();var u=s.data&&s.data.session&&s.data.session.user;
    if(!u){gate('कार कॉल QR बनाने के लिए पहले LiveCard में लॉगिन करें।','/studio/','लॉगिन करें');return}
    var p=await sb.from('studio_profiles').select('phone,card_json').eq('id',u.id).maybeSingle();var d=p.data||{};var sq=(d.card_json&&d.card_json.carqr)||null;window._SB=sb;window._UID=u.id;
    var ph=String(d.phone||(d.card_json&&d.card_json.mobile)||'').replace(/\D/g,'').slice(-10);
    if(!/^[6-9][0-9]{9}$/.test(ph)){gate('QR बनाने के लिए प्रोफ़ाइल में अपना मोबाइल नंबर भरें। QR उसी नंबर से बनेगा।','/studio/#me','प्रोफ़ाइल में नंबर भरें');return}
    $('m').value=ph;$('m').readOnly=true;$('who').textContent='';
    if(sq){$('sv').textContent='✓ आपके सेव किए हुए QR प्रोफ़ाइल से खुले'}
    $('main').hidden=false;window._initCars(sq);draw();
  }catch(e){gate('अभी लोड नहीं हो सका। दोबारा कोशिश करें।')}
})();
})();
</script></body></html>
