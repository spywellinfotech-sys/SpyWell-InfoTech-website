<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>बिज़नेस डायरेक्टरी | DynaMe</title><meta name="robots" content="noindex"><link rel="icon" href="/favicon.png">
<style>body{margin:0;background:#fbf5f4;font:16px/1.5 Hind,Poppins,system-ui,sans-serif;color:#1a1212}
.top{background:linear-gradient(135deg,#b30e15,#ef3b34);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}.top img{width:34px;height:34px;border-radius:50%}.top b{font-size:17px}.top a{margin-left:auto;color:#fff;font-size:14px}
.w{max-width:560px;margin:0 auto;padding:14px}input,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #f0d6d4;background:#fff;color:#1a1212;width:100%;box-sizing:border-box}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1;min-width:0}
.c{background:#fff;border:1px solid #f0d6d4;border-left:5px solid #d4141c;border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 2px 8px rgba(212,20,28,.08)}.hd{display:flex;gap:10px;align-items:center}.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#b30e15,#ef3b34);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.sum{display:flex;gap:8px;margin-top:10px}.sum div{flex:1;text-align:center;background:linear-gradient(145deg,#fff1f0,#fff);border:1px solid #f0d6d4;border-radius:14px;padding:8px 4px}.sum b{display:block;font-size:20px;color:#b30e15}.sum span{font-size:11px;color:#6e5b5b}.c h3{margin:0;font-size:17px}.k{color:#6e5b5b;font-size:13px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.acts a,.acts button{flex:1;min-width:80px;text-align:center;text-decoration:none;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid #d4141c;color:#d4141c;background:#fff}
.acts a.p{background:#d4141c;color:#fff}.acts a.g{background:#e7f8ee;border-color:#1ea952;color:#0b6b32}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#fff1f0;color:#d4141c;margin-left:6px}.tag.v{background:#e7f8ee;color:#0b6b32}.tag.f{background:#fff4c2;color:#7a5b00}
.adm{background:#fff8e1;border:1px solid #f0d98a;border-radius:14px;padding:12px;margin-top:10px}.adm button{width:auto;padding:6px 10px;font-size:13px;margin:4px 4px 0 0}
</style></head><body>
<div class="top" id="tp"><img src="/studio/vicard-icon.png" alt=""><b>बिज़नेस डायरेक्टरी</b><a href="/studio/">← ऐप</a></div>
<div class="w"><div id="m" class="k" style="padding:30px 0;text-align:center">लोड हो रहा है…</div><div id="adm"></div><div id="bar" hidden>
<input id="q" type="search" placeholder="🔍 नाम, दुकान, व्यवसाय या शहर से खोजें"><div class="row"><select id="ind"></select><select id="city"><option value="">सभी शहर</option></select></div></div>
<div class="sum" id="sum" hidden><div><b id="s1">0</b><span>लिस्टिंग</span></div><div><b id="s2">0</b><span>शहर</span></div></div><div id="list"></div><button id="more" hidden style="margin-top:12px">और दिखाएँ</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var B='https://rxhanrtoaplwphmwpgqg.supabase.co',K='sb_publishable_C76zU42qscFbBnfOcn5Zew_1VcRcL4d';
var sb=window.supabase.createClient(B,K,{auth:{storageKey:'spywell-studio-auth'}});
if(/[?&]embed=1/.test(location.search)){document.getElementById('tp').style.display='none'}
function $(i){return document.getElementById(i)}function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var OFF=0,LIM=20,TOT=0,TM=null,ISADM=false,CITIES=[],SAVED={};
async function loadSaved(){try{var u=await sb.auth.getUser();if(!u.data||!u.data.user)return;var r=await sb.from('studio_saved_cards').select('slug').eq('product_type','visiting');SAVED={};(r.data||[]).forEach(function(x){SAVED[x.slug]=1})}catch(e){}}
async function go(more){
  if(!more){OFF=0;$('list').textContent=''}
  var r=await sb.rpc('studio_dir_list',{p_q:$('q').value.trim(),p_ind:$('ind').value,p_city:$('city').value,p_off:OFF,p_lim:LIM});
  var d=r.data;
  if(r.error&&/permission|denied|401|403/i.test(String(r.error.message||r.error.code))){d={error:'login'}}
  if(d&&d.error==='login'){$('m').hidden=false;$('bar').hidden=true;$('more').hidden=true;$('m').textContent='';var lp=mk('div','','डायरेक्टरी देखने के लिए पहले लॉगिन करें।');lp.style.marginBottom='10px';var lb=mk('a','','🔐 लॉगिन करें');lb.href='/studio/';lb.style.cssText='display:inline-block;background:#d4141c;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600';$('m').appendChild(lp);$('m').appendChild(lb);return}
  if(d&&d.error==='rate'){$('m').hidden=false;$('m').textContent='थोड़ी देर बाद दोबारा कोशिश करें।';return}
  if(r.error||!d){$('m').textContent='लोड नहीं हुआ।';$('m').hidden=false;return}
  if(d.error==='closed'){$('m').hidden=false;$('m').textContent='बिज़नेस डायरेक्टरी जल्द आ रही है।';$('bar').hidden=true;$('more').hidden=true;return}
  $('m').hidden=true;$('bar').hidden=false;TOT=d.total||0;$('sum').hidden=false;$('s1').textContent=TOT;$('s2').textContent=(d.cities||[]).length;
  if(!more){var cs=$('city'),cur=cs.value;cs.textContent='';var o0=mk('option','','सभी शहर');o0.value='';cs.appendChild(o0);(d.cities||[]).forEach(function(c){var o=mk('option','',c);o.value=c;cs.appendChild(o)});cs.value=cur}
  if(!more&&!(d.rows||[]).length){$('list').appendChild(mk('div','k','कोई लिस्टिंग नहीं मिली।'))}
  (d.rows||[]).forEach(function(x){var c=mk('div','c'),hd=mk('div','hd'),av=mk('div','av'),tb=mk('div',''),h=mk('h3','',x.business||x.name||'कार्ड');if(x.img){var im=document.createElement('img');im.src=x.img;im.alt='';im.onerror=function(){av.textContent=((x.business||x.name||'?').trim()[0]||'?').toUpperCase();im.remove()};av.appendChild(im)}else av.textContent=((x.business||x.name||'?').trim()[0]||'?').toUpperCase();hd.appendChild(av);hd.appendChild(tb);c.appendChild(hd);if(x.verified)h.appendChild(mk('span','tag v','✓ वेरिफ़ाइड'));if(x.featured)h.appendChild(mk('span','tag f','⭐ खास'));tb.appendChild(h);
    var meta=[x.name&&x.business?x.name:'',x.designation,x.industry_name,x.city].filter(Boolean).join(' · ');if(meta)tb.appendChild(mk('div','k',meta));if(x.about)c.appendChild(mk('div','',x.about)).style.cssText='font-size:14px;margin-top:4px';
    var a=mk('div','acts'),v=mk('a','p','📇 कार्ड देखें');v.href='/v/'+encodeURIComponent(x.slug);a.appendChild(v);
    if(x.site){var w=mk('a','','🌐 वेबसाइट');w.href='/web/'+encodeURIComponent(x.slug);a.appendChild(w)}
    var sv=mk('button','',SAVED[x.slug]?'✓ सेव है':'💾 सेव करें');sv.type='button';if(SAVED[x.slug]){sv.disabled=true;sv.style.opacity='.7'}
    sv.onclick=async function(){sv.disabled=true;sv.textContent='सेव हो रहा है…';var q=await sb.rpc('studio_save_card',{p_type:'visiting',p_slug:x.slug});var m=q&&q.data;
      if(m==='ok'){SAVED[x.slug]=1;sv.textContent='✓ सेव है';sv.style.opacity='.7'}
      else if(m==='own'){sv.textContent='यह आपका अपना कार्ड है'}
      else if(m==='login'){sv.disabled=false;sv.textContent='पहले लॉगिन करें'}
      else if(m==='limit'){sv.textContent='सेव की सीमा पूरी'}
      else{sv.disabled=false;sv.textContent='💾 सेव करें (दोबारा)'}};
    a.appendChild(sv);c.appendChild(a);$('list').appendChild(c)});
  OFF+=(d.rows||[]).length;$('more').hidden=OFF>=TOT}
async function admin(){
  var a=await sb.rpc('studio_is_admin');if(a.data!==true)return;ISADM=true;
  var l=await sb.rpc('studio_dir_admin_list');if(!l.data)return;var box=$('adm');box.textContent='';var w=mk('div','adm');box.appendChild(w);
  var open=l.data.open==='1';w.appendChild(mk('b','','🛠 एडमिन: डायरेक्टरी '+(open?'सबके लिए चालू है':'अभी सिर्फ़ एडमिन को दिखती है')));
  var tg=mk('button','',open?'सबके लिए बंद करें':'सबके लिए चालू करें');tg.type='button';tg.onclick=async function(){if(!confirm(open?'डायरेक्टरी सिर्फ़ एडमिन तक सीमित करें?':'डायरेक्टरी सबके लिए चालू करें?'))return;await sb.rpc('studio_dir_flag',{p_on:!open});location.reload()};w.appendChild(tg);
  (l.data.rows||[]).forEach(function(x){var r=mk('div','');r.style.cssText='border-top:1px dashed #f0d98a;margin-top:8px;padding-top:6px;font-size:14px';
    var pu=x.paid_until?new Date(x.paid_until):null,exp=pu&&pu<new Date();
    r.appendChild(mk('div','',(x.business||x.name||x.slug)+' · '+(x.mobile||'')+(x.city?' · '+x.city:'')));
    r.appendChild(mk('div','k',(x.listed?'लिस्टेड':'लिस्ट नहीं')+' · वैधता: '+(pu?pu.toLocaleDateString('hi-IN'):'तय नहीं')+(exp?' (खत्म)':'')+(x.suspended?' · बंद':'')));
    function bt(t,fn){var b=mk('button','',t);b.type='button';b.onclick=async function(){b.disabled=true;await fn();location.reload()};r.appendChild(b)}
    bt('+1 साल',function(){var b=pu&&pu>new Date()?pu:new Date();b=new Date(b.getTime());b.setFullYear(b.getFullYear()+1);return sb.rpc('studio_dir_admin_set',{p_design:x.design_id,p_paid_until:b.toISOString()})});
    bt(x.verified?'वेरिफ़ाई हटाएँ':'वेरिफ़ाई',function(){return sb.rpc('studio_dir_admin_set',{p_design:x.design_id,p_verified:!x.verified})});
    bt(x.featured?'खास हटाएँ':'खास करें',function(){return sb.rpc('studio_dir_admin_set',{p_design:x.design_id,p_featured:!x.featured})});
    bt(x.suspended?'चालू करें':'बंद करें',function(){return sb.rpc('studio_dir_admin_set',{p_design:x.design_id,p_suspended:!x.suspended})});
    w.appendChild(r)})}
async function init(){
  var si=await sb.from('studio_industries').select('id,name_hi,sort').order('sort',{ascending:true}),s=$('ind'),o0=mk('option','','सभी व्यवसाय');o0.value='';s.appendChild(o0);(si.data||[]).forEach(function(o){var op=mk('option','',o.name_hi);op.value=o.id;s.appendChild(op)});
  $('q').oninput=function(){clearTimeout(TM);TM=setTimeout(function(){go(false)},350)};$('ind').onchange=$('city').onchange=function(){go(false)};$('more').onclick=function(){go(true)};
  await loadSaved();await go(false);admin()}
init();
})();
</script></body></html>
