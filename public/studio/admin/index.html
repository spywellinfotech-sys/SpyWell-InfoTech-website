  function drawBar(){bar.textContent='';
    [['all','सभी'],['invitation','💌 इनविटेशन'],['visiting','📇 विज़िटिंग']].forEach(function(x){bar.appendChild(chip(x[1],fT===x[0],function(){fT=x[0];drawBar();draw()}))});
    [['all','सब'],['free','🆓 फ़्री'],['prem','👑 प्रीमियम'],['off','⛔ बंद']].forEach(function(x){bar.appendChild(chip(x[1],fS===x[0],function(){fS=x[0];drawBar();draw()}))})}
  function field(lbl,inp){return h('label',{style:'display:block;margin-top:8px;font-size:13px;font-weight:700;color:#5a4630'},[document.createTextNode(lbl),inp])}
  function draw(){list.textContent='';var n=0;
    rows.forEach(function(t){
      if(fT!=='all'&&t.product_type!==fT)return;
      var pr=price(t);if(fS==='free'&&pr>0)return;if(fS==='prem'&&!(pr>0))return;if(fS==='off'&&t.active)return;
      if(q&&(t.name+' '+t.id+' '+(t.tno||'')+' no'+(t.tno||'')).toLowerCase().indexOf(q.replace(/^№|^#/,''))<0)return;n++;
      var sw=h('button',{type:'button',class:'sw'+(t.active?' on':''),'aria-label':t.active?'चालू':'बंद'});sw.appendChild(h('i'));
      var lb=h('span',{class:'swl',text:t.active?'चालू':'बंद'});
      sw.onclick=async function(e){e.stopPropagation();sw.disabled=true;var x=await sb.from('studio_templates').update({active:!t.active}).eq('id',t.id).select('id');
        if(x.error||!x.data.length){sw.disabled=false;lb.textContent='नहीं बदला';return}t.active=!t.active;sw.disabled=false;sw.className='sw'+(t.active?' on':'');lb.textContent=t.active?'चालू':'बंद'};
      var badge=h('span',{class:'st',style:'margin-left:6px;background:'+(pr>0?'#fff0c2':'#e6f6ec')+';color:'+(pr>0?'#8a5a00':'#0a6b2f'),text:pr>0?'👑 ₹'+pr:'🆓 फ़्री'});
      var title=h('b',{style:'display:block;font-size:15px',text:'№'+(t.tno||'?')+' · '+t.name});title.appendChild(badge);
      var info=h('div',{style:'flex:1;min-width:0;cursor:pointer'},[title,h('div',{class:'k',text:(TYN[t.product_type]||'')+' · '+t.id+' · क्रम '+t.sort+' · ✏️ बदलने के लिए दबाएँ'})]);
      var row=h('div',{class:'trow'},[info,lb,sw]);var box=h('div');box.hidden=true;
      info.onclick=function(){box.hidden=!box.hidden;if(!box.hidden&&!box.firstChild)build(t,box,function(){draw()})};
      var item=h('div',{style:'margin-bottom:8px'},[row,box]);list.appendChild(item)});
    cnt.textContent=n+' टेम्पलेट दिख रहे हैं (कुल '+rows.length+')'}
  function build(t,box,done){
    var c=t.config||{};
    var card=h('div',{class:'card',style:'margin-top:4px'});box.appendChild(card);
    var nm=h('input',{type:'text',maxlength:60,value:t.name,style:'width:100%;box-sizing:border-box'});
    var so=h('input',{type:'number',min:0,max:9999,value:String(t.sort),inputmode:'numeric',style:'width:100%;box-sizing:border-box'});
    var pm=h('input',{type:'checkbox'});pm.checked=c.premium===true;
    var pl=h('label',{style:'display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700'},[pm,h('span',{text:'👑 प्रीमियम टेम्पलेट (इस्तेमाल पर पैसे लगें)'})]);
    var pp=h('input',{type:'number',min:1,max:99999,inputmode:'numeric',placeholder:'ख़ाली = डिफ़ॉल्ट ₹'+defPrice(t),style:'width:100%;box-sizing:border-box'});if(parseInt(c.premium_price)>0)pp.value=String(parseInt(c.premium_price));
    var pw=field('इस टेम्पलेट की अलग कीमत ₹ (ख़ाली छोड़ें तो डिफ़ॉल्ट ₹'+defPrice(t)+')',pp);
    function sync(){pw.style.display=pm.checked?'block':'none'}pm.onchange=sync;sync();
    var ds=h('input',{type:'text',maxlength:160,value:t.description||'',style:'width:100%;box-sizing:border-box'});
    var msg=h('div',{class:'k',style:'margin-top:6px'});
    var sv=h('button',{type:'button',class:'btn',style:'margin-top:10px',text:'💾 सेव करें'});
    sv.onclick=async function(){
      var name=nm.value.trim(),sort=parseInt(so.value);if(!name){msg.textContent='नाम ज़रूरी है।';return}if(!(sort>=0)){msg.textContent='क्रम सही संख्या हो।';return}
      var cfg=JSON.parse(JSON.stringify(t.config||{}));
      if(pm.checked){cfg.premium=true;var v=parseInt(pp.value);if(v>0)cfg.premium_price=Math.min(v,99999);else delete cfg.premium_price}else{delete cfg.premium;delete cfg.premium_price}
      sv.disabled=true;msg.textContent='सेव हो रहा है…';
      var x=await sb.from('studio_templates').update({name:name,sort:sort,config:cfg}).eq('id',t.id).select('id');
      sv.disabled=false;if(x.error||!x.data||!x.data.length){msg.textContent='सेव नहीं हुआ।';return}
      t.name=name;t.sort=sort;t.config=cfg;msg.textContent='✓ सेव हो गया';rows.sort(function(a,b){return a.product_type<b.product_type?-1:a.product_type>b.product_type?1:a.sort-b.sort});setTimeout(done,500)};
    card.appendChild(field('टेम्पलेट का नाम',nm));card.appendChild(field('क्रम (छोटा नंबर पहले दिखता है)',so));card.appendChild(pl);card.appendChild(pw);
    card.appendChild(h('div',{class:'k',style:'margin-top:8px',text:'नई कीमत सिर्फ़ आगे की ख़रीद पर लगती है; जिसने पहले ख़रीद लिया उसका टेम्पलेट खुला रहता है। सबके लिए डिफ़ॉल्ट कीमत ऊपर के "💰 सर्विस चार्जेज़" वाले हरे-नीले टाइल में बदलें।'}));
    card.appendChild(sv);card.appendChild(msg)}
  drawBar();draw()}
})();
</script></body></html>
