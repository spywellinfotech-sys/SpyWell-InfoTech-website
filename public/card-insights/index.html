<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Card Insights</title>
<style>
:root{--wine:#8b1a2b;--ink:#2b1a14;--bg:#fdf6e8;--line:#e8d5ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Hind,Poppins,system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:21px;color:var(--wine);margin:6px 0 2px}small{color:#7a6248}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.n{font-size:30px;font-weight:700;color:var(--wine);line-height:1.1}
.k{font-size:12.5px;color:#7a6248}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);width:100%}button{background:var(--wine);color:#fff;border:0;font-weight:600;margin-top:8px}
.bar{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}.bar div{flex:1;background:var(--wine);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bar span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}.ln:last-child{border:0}
#err{color:#b00020;margin-top:8px}
</style></head><body>
<h1>Card Insights</h1><small>Kajal &amp; Divyanshu wedding card</small>
<div class="card" id="login"><input id="pin" type="password" placeholder="PIN डालें" autocomplete="off"><button id="go">देखें</button><div id="err"></div></div>
<div id="out" hidden></div>
<script>
var U='https://rxhanrtoaplwphmwpgqg.supabase.co/rest/v1/rpc/card_stats',K='sb_publishable_C76zU42qscFbBnfOcn5Zew_1VcRcL4d';
var L={call1:'अशोक सैनी को कॉल',call2:'विनोद सैनी को कॉल',maps:'Google Maps',pdf:'PDF सेव',jpg:'फ़ोटो सेव',whatsapp:'WhatsApp शेयर',order:'SpyWell ऑर्डर बटन',view:'कार्ड खुला'};
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(pin){
 fetch(U,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_pin:pin,p_card:'kajal-divyanshu'})})
 .then(function(r){return r.json()}).then(function(d){
  if(!d||d.error){document.getElementById('err').textContent='PIN गलत है';return}
  try{sessionStorage.setItem('pp',pin)}catch(e){}
  document.getElementById('login').hidden=true;var o=document.getElementById('out');o.hidden=false;
  var mx=Math.max.apply(null,d.days.map(function(x){return x.v}).concat([1]));
  var h='<div class="card"><div class="row"><div><div class="n">'+d.views+'</div><div class="k">कुल व्यू</div></div><div><div class="n">'+d.visitors+'</div><div class="k">अलग लोग</div></div><div><div class="n">'+d.today+'</div><div class="k">आज</div></div></div></div>';
  h+='<div class="card"><b>पिछले 14 दिन</b><div class="bar">'+d.days.map(function(x){return'<div style="height:'+Math.round(x.v/mx*100)+'%"><span>'+x.v+'</span></div>'}).join('')+'</div></div>';
  h+='<div class="card"><b>बटन क्लिक</b>'+(Object.keys(d.clicks).map(function(k){return'<div class="ln"><span>'+esc(L[k]||k)+'</span><b>'+d.clicks[k]+'</b></div>'}).join('')||'<div class="k">अभी कोई क्लिक नहीं</div>')+'</div>';
  h+='<div class="card"><b>फ़ोन / कंप्यूटर</b>'+Object.keys(d.devices).map(function(k){return'<div class="ln"><span>'+esc(k)+'</span><b>'+d.devices[k]+'</b></div>'}).join('')+'</div>';
  h+='<div class="card"><b>कहाँ से आए</b>'+Object.keys(d.sources).map(function(k){return'<div class="ln"><span>'+esc(k)+'</span><b>'+d.sources[k]+'</b></div>'}).join('')+'</div>';
  h+='<div class="card"><b>ताज़ा गतिविधि</b>'+d.recent.map(function(x){var t=new Date(x.t).toLocaleString('hi-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});return'<div class="ln"><span>'+esc(L[x.e]||x.e)+'</span><small>'+t+'</small></div>'}).join('')+'</div>';
  h+='<button onclick="location.reload()">रीफ़्रेश</button>';o.innerHTML=h}).catch(function(){document.getElementById('err').textContent='नेटवर्क दिक्कत, दोबारा कोशिश करें'})}
document.getElementById('go').onclick=function(){load(document.getElementById('pin').value.trim())};
document.getElementById('pin').onkeydown=function(e){if(e.key==='Enter')load(this.value.trim())};
try{var sp=sessionStorage.getItem('pp');if(sp)load(sp)}catch(e){}
</script></body></html>
